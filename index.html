      function renderResultsCompositeSVG(blocks){
        const svgNS = "http://www.w3.org/2000/svg";
        const W = 800;
        const pad = 16;
        const lineH = 25;
        
        let totalH = 0;
        const fontSans = "system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial";

        let measureCtx = null;
        try {
          const measureCanvas = document.createElement("canvas");
          measureCtx = measureCanvas.getContext("2d");
        } catch (_) {}

        // Calculate heights and store block offsets
        for (const block of blocks) {
          block.textBlockH = pad + (block.lines.length * lineH) + 14;
          block.chartH = block.chartSvg ? (Number(block.chartSvg.getAttribute("height")) || 465) : 0;
          block.totalH = block.textBlockH + block.chartH + pad;
          totalH += block.totalH;
        }
        
        const H = totalH;

        const root = document.createElementNS(svgNS, "svg");
        root.setAttribute("xmlns", svgNS);
        root.setAttribute("viewBox", `0 0 ${W} ${H}`);
        root.setAttribute("width", String(W));
        root.setAttribute("height", String(H));
        root.appendChild(el(svgNS, "rect", { x: 0, y: 0, width: W, height: H, fill: "#fff" }));

        let currentYOffset = 0;

        for (const block of blocks) {
          // Identify notes lines range in this block
          let notesStartIdx = -1;
          let notesEndIdx = -1;
          for (let i = 0; i < block.lines.length; i++) {
            if (block.lines[i] === "Notes:") {
              notesStartIdx = i;
            } else if (notesStartIdx !== -1) {
              if (block.lines[i].startsWith("  ") || block.lines[i] === "") {
                notesEndIdx = i;
              } else {
                break;
              }
            }
          }
          if (notesStartIdx !== -1 && notesEndIdx === -1) {
            notesEndIdx = notesStartIdx;
          }

          // Draw notes box if notes exist
          if (notesStartIdx !== -1) {
            const boxTopY = currentYOffset + pad + (notesStartIdx * lineH) + 4;
            const boxHeight = ((notesEndIdx - notesStartIdx + 1) * lineH) + 6;
            const boxX = pad - 6;
            const boxW = W - (pad * 2) + 12;

            root.appendChild(el(svgNS, "rect", {
              x: boxX,
              y: boxTopY,
              width: boxW,
              height: boxHeight,
              fill: "rgba(248, 250, 252, 0.95)",
              stroke: "#94a3b8",
              "stroke-width": 1.5,
              rx: 8,
              ry: 8
            }));
          }

          for (let i = 0; i < block.lines.length; i++){
            const isTitle = i === 0;
            const lineText = block.lines[i];
            const yPos = currentYOffset + pad + (i + 1) * lineH;

            // Ratio line with circled/bordered actual ratio (safely spaced to never overlap label text)
            if (lineText.includes("(ratio):")) {
              const colonIdx = lineText.indexOf("(ratio):");
              const label = lineText.substring(0, colonIdx + 8).trim();
              const ratioVal = lineText.substring(colonIdx + 8).trim();

              let measuredLabelW = 0;
              let measuredRatioW = 0;
              try {
                if (measureCtx) {
                  measureCtx.font = `bold 14px ${fontSans}`;
                  measuredLabelW = measureCtx.measureText(label).width;
                  measureCtx.font = `bold 15px ${fontSans}`;
                  measuredRatioW = measureCtx.measureText(ratioVal).width;
                }
              } catch (_) {}

              const charEstimateW = Math.ceil(label.length * 9.2);
              const labelW = Math.max(measuredLabelW, charEstimateW, 310);
              const ratioW = Math.max(measuredRatioW, Math.ceil(ratioVal.length * 11), 32);

              let isGoalMet = false;
              let strokeColor = "#6366f1";
              let fillColor = "#eef2ff";
              let textColor = "#312e81";

              const ratioNum = parseInt(ratioVal.split(":")[0], 10);
              if (!isNaN(ratioNum)) {
                if (lineText.includes("Positive to Negative")) {
                  isGoalMet = ratioNum >= 5;
                  strokeColor = isGoalMet ? "#16a34a" : "#dc2626";
                  fillColor = isGoalMet ? "#f0fdf4" : "#fef2f2";
                  textColor = isGoalMet ? "#15803d" : "#991b1b";
                } else if (lineText.startsWith("Opportunities to Respond")) {
                  isGoalMet = ratioNum >= 3;
                  strokeColor = isGoalMet ? "#16a34a" : "#dc2626";
                  fillColor = isGoalMet ? "#f0fdf4" : "#fef2f2";
                  textColor = isGoalMet ? "#15803d" : "#991b1b";
                } else {
                  strokeColor = "#6366f1";
                  fillColor = "#eef2ff";
                  textColor = "#312e81";
                }
              }

              // Subtle row background
              root.appendChild(el(svgNS, "rect", {
                x: pad - 4,
                y: yPos - lineH + 5,
                width: W - (pad * 2) + 8,
                height: lineH + 1,
                fill: (lineText.includes("Positive to Negative") || lineText.startsWith("Opportunities to Respond"))
                  ? (isGoalMet ? "rgba(240, 253, 244, 0.5)" : "rgba(254, 242, 242, 0.5)")
                  : "rgba(241, 245, 249, 0.5)",
                rx: 4
              }));

              // Render label text
              root.appendChild(el(svgNS, "text", {
                x: pad,
                y: yPos,
                "text-anchor": "start",
                "font-size": 14,
                "font-family": fontSans,
                "font-weight": 700,
                fill: "rgba(0,0,0,.90)"
              }, label));

              // Circle/pill border around the actual ratio
              const badgeH = 26;
              const badgePadX = 14;
              const badgeW = Math.max(ratioW + (badgePadX * 2), 52);
              const badgeX = pad + labelW + 16;
              const badgeY = yPos - 18;

              root.appendChild(el(svgNS, "rect", {
                x: badgeX,
                y: badgeY,
                width: badgeW,
                height: badgeH,
                rx: badgeH / 2,
                ry: badgeH / 2,
                fill: fillColor,
                stroke: strokeColor,
                "stroke-width": 2
              }));

              // Text inside the circled ratio
              root.appendChild(el(svgNS, "text", {
                x: badgeX + (badgeW / 2),
                y: yPos,
                "text-anchor": "middle",
                "font-size": 15,
                "font-family": fontSans,
                "font-weight": 800,
                fill: textColor
              }, ratioVal));

              continue;
            }

            if (lineText.startsWith("Lesson target referenced:") || lineText.startsWith("Agreed upon teaching materials used:") || lineText.startsWith("Is there a regulation space in the classroom?:") || lineText.startsWith("Is there a graphic depicting the character trait of the month?:") || lineText.startsWith("Is there evidence the educator integrates SEL concepts and strategies into core subjects?:")) {
              const isYes = lineText.endsWith("Yes");
              const isNo = lineText.endsWith("No");
              if (isYes || isNo) {
                root.appendChild(el(svgNS, "rect", {
                  x: pad - 4,
                  y: yPos - lineH + 5,
                  width: W - (pad * 2) + 8,
                  height: lineH + 1,
                  fill: isYes ? "rgba(134, 239, 172, 0.4)" : "rgba(252, 165, 165, 0.4)",
                  rx: 4
                }));
              }
            } else if (lineText.startsWith("Educator models warm") || lineText.startsWith("Educator joins in") || lineText.startsWith("Educator leads") || lineText.startsWith("Students share") || lineText.startsWith("Overall atmosphere") || lineText.startsWith("Evidence of class agreement")) {
              const valStr = lineText.split(": ")[1];
              const labels = ["0 - Not Present", "1 - Partial", "2 - Fully Implemented"];
              const rowColors = ["#d1d5db4d", "#93c5fd4d", "#3b82f64d"];
              const valIndex = labels.indexOf(valStr);
              if (valIndex >= 0) {
                root.appendChild(el(svgNS, "rect", {
                  x: pad - 4,
                  y: yPos - lineH + 5,
                  width: W - (pad * 2) + 8,
                  height: lineH + 1,
                  fill: rowColors[valIndex],
                  rx: 4
                }));
              }
            }

            if (lineText === "Notes:") {
              root.appendChild(el(svgNS, "text", {
                x: pad + 4,
                y: yPos,
                "text-anchor": "start",
                "font-size": 14,
                "font-family": fontSans,
                "font-weight": 700,
                fill: "#0f172a"
              }, lineText));
              continue;
            }

            if (lineText.startsWith("  ")) {
              const textEl = el(svgNS, "text", {
                x: pad + 4,
                y: yPos,
                "text-anchor": "start",
                "font-size": 13.5,
                "font-family": fontSans,
                fill: "#334155"
              });
              textEl.setAttribute("xml:space", "preserve");

              if (lineText.includes("<b>") || lineText.includes("**")) {
                const segments = parseLineToSvgSegments(lineText);
                for (const seg of segments) {
                  const tspan = el(svgNS, "tspan", {
                    "font-weight": seg.bold ? 700 : 500,
                    fill: seg.bold ? "#0f172a" : "#334155"
                  }, seg.text);
                  textEl.appendChild(tspan);
                }
              } else {
                textEl.setAttribute("font-weight", "500");
                textEl.textContent = lineText;
              }

              root.appendChild(textEl);
              continue;
            }

            root.appendChild(el(svgNS, "text", {
              x: pad,
              y: yPos,
              "text-anchor": "start",
              "font-size": isTitle ? 16 : 14,
              "font-family": fontSans,
              "font-weight": isTitle ? 700 : 500,
              fill: "rgba(0,0,0,.90)"
            }, lineText));
          }

          if (block.chartSvg) {
            root.appendChild(el(svgNS, "line", {
              x1: pad, y1: currentYOffset + block.textBlockH - 7,
              x2: W - pad, y2: currentYOffset + block.textBlockH - 7,
              stroke: "rgba(0,0,0,.12)",
              "stroke-width": 1
            }));

            const g = document.createElementNS(svgNS, "g");
            g.setAttribute("transform", `translate(0 ${currentYOffset + block.textBlockH})`);
            const cloned = block.chartSvg.cloneNode(true);
            while (cloned.firstChild){
              g.appendChild(cloned.firstChild);
            }
            root.appendChild(g);
          }
          currentYOffset += block.totalH;
        }

        return root;
      }

      function showResults(){
        state.currentScreen = "results";
        mountTemplate("screen-results");

        const durationMs = state.stoppedAt - state.startedAt;
        const bins = computeBinsByKind(state.otrEvents, durationMs);
        
        // Calculate new totals
        const totalStructWhole = bins.structWhole.reduce((a, b) => a + b, 0);
        const totalStructSmall = bins.structSmall.reduce((a, b) => a + b, 0);
        const totalStructPartners = bins.structPartners.reduce((a, b) => a + b, 0);
        const totalStructIndividual = bins.structIndividual.reduce((a, b) => a + b, 0);

        const totalOtrChoral = bins.otrChoral.reduce((a, b) => a + b, 0);
        const totalOtrCloze = bins.otrCloze.reduce((a, b) => a + b, 0);
        const totalOtrWhiteboard = bins.otrWhiteboard.reduce((a, b) => a + b, 0);
        const totalOtrPrecision = bins.otrPrecision.reduce((a, b) => a + b, 0);
        const totalOtrElbow = bins.otrElbow.reduce((a, b) => a + b, 0);
        const totalOtrWarm = bins.otrWarm.reduce((a, b) => a + b, 0);
        const totalOtrCold = bins.otrCold.reduce((a, b) => a + b, 0);
        const totalOtrVolunteer = bins.otrVolunteer.reduce((a, b) => a + b, 0);

        const totalSpecific = bins.specific.reduce((a, b) => a + b, 0);
        const totalGeneral = bins.general.reduce((a, b) => a + b, 0);
        const totalCorrective = bins.corrective.reduce((a, b) => a + b, 0);
        const totalRedirect = bins.redirect.reduce((a, b) => a + b, 0);
        const totalGenCrit = bins.genCrit.reduce((a, b) => a + b, 0);
        const totalIndCrit = bins.indCrit.reduce((a, b) => a + b, 0);

        const totalOtr = state.otrEvents.filter(e => ["otrChoral","otrCloze","otrWhiteboard","otrPrecision","otrElbow","otrWarm","otrCold","otrVolunteer"].includes(e.kind)).length;
        const totalPraise = state.otrEvents.filter(e => ["specific","general","corrective","redirect","genCrit","indCrit"].includes(e.kind)).length;
        const totalEngagement = state.otrEvents.filter(e => ["structWhole","structSmall","structPartners","structIndividual"].includes(e.kind)).length;
        
        const positivePraise = totalSpecific + totalGeneral + totalCorrective;
        const negativePraise = totalRedirect + totalGenCrit + totalIndCrit;

        const resultsTitle = document.getElementById("resultsTitle");
        
        if (state.mode === "Praise") {
          resultsTitle.textContent = "Social Emotional Learning Results";
        } else if (state.mode === "Lesson Structure") {
          resultsTitle.textContent = "Lesson Structure Results";
        } else if (state.mode === "All") {
          resultsTitle.textContent = "All Results";
        } else {
          resultsTitle.textContent = "Opportunities to Respond Results";
        }

        document.getElementById("resultsContext").textContent = `Observed Educator Name: ${state.educatorName}`;
        
        const renderModes = state.mode === "All" ? ["Lesson Structure", "OTRs", "Praise"] : [state.mode];
        const sharedBlocks = [];
        
        for (const renderMode of renderModes) {
          // Create lines and charts for this block
          const oldStateMode = state.mode;
          state.mode = renderMode;
          
          let chartSvg;
          let modeEvents = [];
          if (renderMode === "Praise") {
             modeEvents = state.otrEvents.filter(e => ["specific","general","corrective","redirect","genCrit","indCrit"].includes(e.kind));
             chartSvg = renderOtrMultiLineChartSVG(modeEvents, durationMs);
          } else if (renderMode === "Lesson Structure") {
             modeEvents = state.otrEvents.filter(e => ["structWhole","structSmall","structPartners","structIndividual"].includes(e.kind));
             chartSvg = renderEngagementStackedBarChartSVG(modeEvents, durationMs);
          } else {
             modeEvents = state.otrEvents.filter(e => ["otrChoral","otrCloze","otrWhiteboard","otrPrecision","otrElbow","otrWarm","otrCold","otrVolunteer"].includes(e.kind));
             chartSvg = renderOtrMultiLineChartSVG(modeEvents, durationMs);
          }
          
          const curOtrTotal = renderMode === "Praise" ? totalPraise : renderMode === "Lesson Structure" ? totalEngagement : totalOtr;
          const curRatioText = renderMode === "Praise" ? formatPraiseRatio(positivePraise, negativePraise, durationMs) : formatOtrRatio(curOtrTotal, durationMs);
          
          const lines = buildResultsLines({
              educator: state.educatorName,
              recordedOn: state.startWall ? state.startWall.toLocaleDateString() : "",
              recordedFrom: formatTime(state.startWall) + " to " + formatTime(state.stopWall),
              durationMs,
              lessonTargetPosted: state.lessonTargetPosted,
              curriculaMaterialsUsed: state.curriculaMaterialsUsed,
              regulationSpace: state.regulationSpace,
              characterTraitGraphic: state.characterTraitGraphic,
              
              structWhole: totalStructWhole,
              structSmall: totalStructSmall,
              structPartners: totalStructPartners,
              structIndividual: totalStructIndividual,

              otrChoral: totalOtrChoral,
              otrCloze: totalOtrCloze,
              otrWhiteboard: totalOtrWhiteboard,
              otrPrecision: totalOtrPrecision,
              otrElbow: totalOtrElbow,
              otrWarm: totalOtrWarm,
              otrCold: totalOtrCold,
              otrVolunteer: totalOtrVolunteer,

              specific: totalSpecific,
              general: totalGeneral,
              corrective: totalCorrective,
              redirect: totalRedirect,
              genCrit: totalGenCrit,
              indCrit: totalIndCrit,

              otrTotal: curOtrTotal,
              ratioText: curRatioText,
              notes: renderMode === renderModes[0] ? state.notes : null,
              engagementChecks: state.engagementChecks,
              praiseRatings: state.praiseRatings,
              skipSELObservations: state.skipSELObservations
          });
          state.mode = oldStateMode;
          // Strip top common info if not first
          if (renderMode !== renderModes[0]) {
             lines.splice(1, 6); // remove educator, date, time, duration, materials, target
          }
          
          sharedBlocks.push({ lines, chartSvg });
        }

        const resultsGraphicImg = document.getElementById("resultsGraphicImg");
        const resultsLoadingIndicator = document.getElementById("resultsLoadingIndicator");

        let cachedBlob = null;
        let cachedObjectUrl = null;
        let isGenerating = false;

        document.getElementById("restartBtn").addEventListener("click", () => {
          if (cachedObjectUrl) URL.revokeObjectURL(cachedObjectUrl);
          showSetup("setup");
        });
        document.getElementById("resultsBackBtn").addEventListener("click", () => {
          if (cachedObjectUrl) URL.revokeObjectURL(cachedObjectUrl);
          showQuestions();
        });

        const shareBtn = document.getElementById("shareBtn");
        const shareStatus = document.getElementById("shareStatus");

        const updateFirstBlockLines = () => {
          const oldStateMode = state.mode;
          state.mode = renderModes[0];
          const firstOtrTotal = state.mode === "Praise" ? totalPraise : state.mode === "Lesson Structure" ? totalEngagement : totalOtr;
          const firstRatioText = state.mode === "Praise" ? formatPraiseRatio(positivePraise, negativePraise, durationMs) : formatOtrRatio(firstOtrTotal, durationMs);
          
          sharedBlocks[0].lines = buildResultsLines({
              educator: state.educatorName,
              recordedOn: state.startWall ? state.startWall.toLocaleDateString() : "",
              recordedFrom: formatTime(state.startWall) + " to " + formatTime(state.stopWall),
              durationMs,
              lessonTargetPosted: state.lessonTargetPosted,
              curriculaMaterialsUsed: state.curriculaMaterialsUsed,
              regulationSpace: state.regulationSpace,
              characterTraitGraphic: state.characterTraitGraphic,
              structWhole: totalStructWhole, structSmall: totalStructSmall, structPartners: totalStructPartners, structIndividual: totalStructIndividual,
              otrChoral: totalOtrChoral, otrCloze: totalOtrCloze, otrWhiteboard: totalOtrWhiteboard,
              otrPrecision: totalOtrPrecision, otrElbow: totalOtrElbow, otrWarm: totalOtrWarm, otrCold: totalOtrCold, otrVolunteer: totalOtrVolunteer,
              specific: totalSpecific, general: totalGeneral, corrective: totalCorrective,
              redirect: totalRedirect, genCrit: totalGenCrit, indCrit: totalIndCrit,
              otrTotal: firstOtrTotal,
              ratioText: firstRatioText,
              notes: state.notes,
              engagementChecks: state.engagementChecks,
              praiseRatings: state.praiseRatings,
              skipSELObservations: state.skipSELObservations
          });
          state.mode = oldStateMode;
        };

        const renderImageBlob = async () => {
          if (isGenerating && cachedBlob) return cachedBlob;
          isGenerating = true;
          try {
            updateFirstBlockLines();
            const composite = renderResultsCompositeSVG(sharedBlocks);
            const blob = await svgElementToPngBlob(composite, 2);
            cachedBlob = blob;
            if (cachedObjectUrl) {
              URL.revokeObjectURL(cachedObjectUrl);
            }
            cachedObjectUrl = URL.createObjectURL(blob);
            if (resultsGraphicImg) {
              resultsGraphicImg.src = cachedObjectUrl;
              resultsGraphicImg.style.display = "block";
            }
            if (resultsLoadingIndicator) {
              resultsLoadingIndicator.style.display = "none";
            }
            return blob;
          } catch (err) {
            console.error("Failed to render composite graphic:", err);
            if (resultsLoadingIndicator) {
              resultsLoadingIndicator.textContent = "Error generating graphic preview.";
            }
            throw err;
          } finally {
            isGenerating = false;
          }
        };

        // Render immediately so the graphic is shown on screen and ready for mobile long-click
        renderImageBlob().catch(() => {});

        // 1. Copy Image button (direct copy to clipboard for iOS 16.7 & modern browsers)
        shareBtn.addEventListener("click", () => {
          shareStatus.textContent = "Copying image to clipboard...";
          shareBtn.disabled = true;

          updateFirstBlockLines();

          const blobPromise = (async () => {
            if (cachedBlob) return cachedBlob;
            return await renderImageBlob();
          })();

          const handleCopySuccess = () => {
            shareStatus.innerHTML = '<span style="color:#15803d; font-weight:bold;">✓ Image copied to clipboard!</span> You can now paste directly into an email or spreadsheet.';
            shareBtn.disabled = false;
            shareBtn.textContent = "Copied!";
            shareBtn.classList.add("copied");
            setTimeout(() => {
              shareBtn.textContent = "Copy Image";
              shareBtn.classList.remove("copied");
            }, 3500);
          };

          const handleCopyFallback = async () => {
            try {
              const blob = await blobPromise;
              const file = new File([blob], safeFilename(), { type: "image/png" });
              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file] });
                shareStatus.textContent = "Shared successfully!";
              } else {
                downloadBlob(blob, safeFilename());
                shareStatus.textContent = "Image downloaded!";
              }
            } catch (fallbackErr) {
              if (fallbackErr.name !== "AbortError") {
                const blob = await blobPromise;
                downloadBlob(blob, safeFilename());
                shareStatus.textContent = "Image downloaded!";
              } else {
                shareStatus.textContent = "";
              }
            }
            shareBtn.disabled = false;
            shareBtn.textContent = "Copy Image";
            shareBtn.classList.remove("copied");
          };

          // iOS 16.7 / WebKit requires navigator.clipboard.write called directly inside user event
          // with ClipboardItem taking a Promise resolving to a Blob.
          try {
            if (navigator.clipboard && navigator.clipboard.write) {
              const item = new ClipboardItem({ "image/png": blobPromise });
              navigator.clipboard.write([item])
                .then(handleCopySuccess)
                .catch(async (clipErr) => {
                  try {
                    const blob = await blobPromise;
                    const item2 = new ClipboardItem({ "image/png": blob });
                    await navigator.clipboard.write([item2]);
                    handleCopySuccess();
                  } catch (clipErr2) {
                    handleCopyFallback();
                  }
                });
            } else {
              handleCopyFallback();
            }
          } catch (err) {
            handleCopyFallback();
          }
        });
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && state.currentScreen === "run") {
          const startBtn = document.getElementById("startBtn");
          if (startBtn && !startBtn.disabled) {
            if (document.activeElement && (
              document.activeElement.tagName.toLowerCase() === "textarea" || 
              document.activeElement.tagName.toLowerCase() === "input" ||
              document.activeElement.isContentEditable ||
              document.activeElement.getAttribute("contenteditable") === "true"
            )) {
              return;
            }
            e.preventDefault();
            startBtn.click();
          }
        }
      });

      // Initialize App
      showSetup();
    });
  </script>
</body>
</html>
