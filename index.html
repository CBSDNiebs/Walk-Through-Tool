        const customOtrTotals = { whole: [], small: [], partner: [], individual: [] };
        if (state.customOtrButtons) {
          for (const cb of state.customOtrButtons) {
            const count = state.otrEvents.filter(e => e.kind === cb.id).length;
            if (customOtrTotals[cb.column]) {
              customOtrTotals[cb.column].push({ label: cb.label, count });
            }
          }
        }

        const customPraiseIds = (state.customPraiseButtons || []).map(c => c.id);
        const customPraiseTotals = [];
        let totalCustomPraiseCount = 0;
        if (state.customPraiseButtons) {
          for (const cb of state.customPraiseButtons) {
            const count = state.otrEvents.filter(e => e.kind === cb.id).length;
            customPraiseTotals.push({ label: cb.label, count });
            totalCustomPraiseCount += count;
          }
        }

        const totalOtr = state.otrEvents.filter(e =>
          e.kind.startsWith("otrWhole_") ||
          e.kind.startsWith("otrSmall_") ||
          e.kind.startsWith("otr") ||
          customIds.includes(e.kind)
        ).length;
        const totalPraise = state.otrEvents.filter(e => [
          "specific","general","corrective","redirect","genCrit","indCrit",
          ...customPraiseIds
        ].includes(e.kind)).length;
        const totalEngagement = state.otrEvents.filter(e => ["structWhole","structSmall","structPartners","structIndividual"].includes(e.kind)).length;
        
        const positivePraise = totalSpecific + totalGeneral + totalCorrective + totalCustomPraiseCount;
        const negativePraise = totalRedirect + totalGenCrit + totalIndCrit;

        const resultsTitle = document.getElementById("resultsTitle");
        
        if (state.mode === "Praise") {
          resultsTitle.textContent = "Instructional Feedback Results";
        } else if (state.mode === "All") {
          if (state.allIncludeOtr && state.allIncludeSel) {
            resultsTitle.textContent = "The Walk Through Tool Results";
          } else if (state.allIncludeOtr) {
            resultsTitle.textContent = "The Walk Through Tool Results (OTR Only)";
          } else if (state.allIncludeSel) {
            resultsTitle.textContent = "The Walk Through Tool Results (Instructional Feedback Only)";
          } else {
            resultsTitle.textContent = "The Walk Through Tool Results (Timers Off)";
          }
        } else {
          resultsTitle.textContent = "Opportunities to Respond Results";
        }

        document.getElementById("resultsContext").textContent = `Observed Educator Name: ${state.educatorName}`;
        
        const originalMode = state.mode;
        const isOtrActive = originalMode === "All" ? state.allIncludeOtr : (originalMode === "OTRs");
        const isPraiseActive = originalMode === "All" ? state.allIncludeSel : (originalMode === "Praise");

        const renderModes = [];
        if (state.mode === "All") {
          if (state.allIncludeOtr) renderModes.push("OTRs");
          if (state.allIncludeSel) renderModes.push("Praise");
          if (renderModes.length === 0) {
            renderModes.push("NotesOnly");
          }
        } else {
          renderModes.push(state.mode);
        }
        const sharedBlocks = [];
        
        for (const renderMode of renderModes) {
          // Create lines and charts for this block
          const oldStateMode = state.mode;
          state.mode = renderMode;
          
          let chartSvg = null;
          let modeEvents = [];
          const structEvents = getStructEvents(state.otrEvents);
          if (renderMode === "Praise") {
             modeEvents = state.otrEvents.filter(e => [
               "specific","general","corrective","redirect","genCrit","indCrit",
               ...customPraiseIds
             ].includes(e.kind));
             chartSvg = renderOtrMultiLineChartSVG(modeEvents, durationMs, structEvents);
          } else if (renderMode === "Lesson Structure" || renderMode === "Engagement Check") {
             modeEvents = state.otrEvents.filter(e => ["structPartners","structIndividual"].includes(e.kind));
             chartSvg = renderEngagementStackedBarChartSVG(modeEvents, durationMs);
          } else if (renderMode === "OTRs") {
             modeEvents = state.otrEvents.filter(e =>
               e.kind.startsWith("otrWhole_") ||
               e.kind.startsWith("otrSmall_") ||
               e.kind.startsWith("otr") ||
               customIds.includes(e.kind)
             );
             chartSvg = renderOtrMultiLineChartSVG(modeEvents, durationMs, structEvents);
          } else {
             chartSvg = null;
          }
          
          const curOtrTotal = renderMode === "Praise" ? totalPraise : (renderMode === "Lesson Structure" || renderMode === "Engagement Check") ? totalEngagement : totalOtr;
          const curRatioText = renderMode === "Praise" ? formatPraiseRatio(positivePraise, negativePraise, durationMs) : (renderMode === "OTRs" ? formatOtrRate(curOtrTotal, durationMs) : formatOtrRatio(curOtrTotal, durationMs));
          
          const lines = buildResultsLines({
              educator: state.educatorName,
              recordedOn: state.startWall ? state.startWall.toLocaleDateString() : "",
              recordedFrom: formatTime(state.startWall) + " to " + formatTime(state.stopWall),
              durationMs,
              lessonTargetPosted: state.lessonTargetPosted,
              curriculaMaterialsUsed: state.curriculaMaterialsUsed,
              regulationSpace: state.regulationSpace,
              characterTraitGraphic: state.characterTraitGraphic,
              
              structWhole: totalStructWhole,
              structSmall: totalStructSmall,
              structPartners: totalStructPartners,
              structIndividual: totalStructIndividual,

              wholeOtr: wholeOtrTotals,
              smallOtr: smallOtrTotals,
              customOtrTotals: customOtrTotals,
              customPraiseTotals: customPraiseTotals,

              specific: totalSpecific,
              general: totalGeneral,
              corrective: totalCorrective,
              redirect: totalRedirect,
              genCrit: totalGenCrit,
              indCrit: totalIndCrit,

              otrTotal: curOtrTotal,
              ratioText: curRatioText,
              otrRatioText: formatOtrRate(totalOtr, durationMs),
              praiseRatioText: formatPraiseRatio(positivePraise, negativePraise, durationMs),
              notes: renderMode === renderModes[0] ? state.notes : null,
              engagementChecks: state.engagementChecks,
              praiseRatings: state.praiseRatings,
              skipSELObservations: state.skipSELObservations,
              skipQuestions: state.skipQuestions,
              isSubsequentBlock: renderMode !== renderModes[0],
              bins,
              events: modeEvents,
              includeOtr: isOtrActive,
              includePraise: isPraiseActive
          });
          state.mode = oldStateMode;
          
          sharedBlocks.push({ lines, chartSvg, durationMs, events: modeEvents });
        }

        const resultsGraphicImg = document.getElementById("resultsGraphicImg");
        const resultsLoadingIndicator = document.getElementById("resultsLoadingIndicator");

        let cachedBlob = null;
        let cachedObjectUrl = null;
        let isGenerating = false;

        document.getElementById("restartBtn").addEventListener("click", () => {
          if (cachedObjectUrl) URL.revokeObjectURL(cachedObjectUrl);
          showSetup("setup");
        });
        document.getElementById("resultsBackBtn").addEventListener("click", () => {
          if (cachedObjectUrl) URL.revokeObjectURL(cachedObjectUrl);
          showQuestions();
        });

        const shareBtn = document.getElementById("shareBtn");
        const shareStatus = document.getElementById("shareStatus");

        const updateFirstBlockLines = () => {
          if (!sharedBlocks || sharedBlocks.length === 0) return;
          const oldStateMode = state.mode;
          state.mode = renderModes[0];
          const firstOtrTotal = state.mode === "Praise" ? totalPraise : ((state.mode === "Lesson Structure" || state.mode === "Engagement Check") ? totalEngagement : totalOtr);
          const firstRatioText = state.mode === "Praise" ? formatPraiseRatio(positivePraise, negativePraise, durationMs) : (state.mode === "OTRs" ? formatOtrRate(firstOtrTotal, durationMs) : formatOtrRatio(firstOtrTotal, durationMs));
          
          let firstModeEvents = [];
          if (state.mode === "Praise") {
            const customPraiseIds = (state.customPraiseButtons || []).map(c => c.id);
            firstModeEvents = state.otrEvents.filter(e => ["specific", "general", "corrective", "redirect", "genCrit", "indCrit", ...customPraiseIds].includes(e.kind));
          } else if (state.mode === "Lesson Structure" || state.mode === "Engagement Check") {
            firstModeEvents = state.otrEvents.filter(e => ["structPartners","structIndividual"].includes(e.kind));
          } else if (state.mode === "OTRs") {
            const customIds = (state.customOtrButtons || []).map(c => c.id);
            firstModeEvents = state.otrEvents.filter(e =>
              e.kind.startsWith("otrWhole_") ||
              e.kind.startsWith("otrSmall_") ||
              e.kind.startsWith("otr") ||
              customIds.includes(e.kind)
            );
          }

          sharedBlocks[0].lines = buildResultsLines({
              educator: state.educatorName,
              recordedOn: state.startWall ? state.startWall.toLocaleDateString() : "",
              recordedFrom: formatTime(state.startWall) + " to " + formatTime(state.stopWall),
              durationMs,
              lessonTargetPosted: state.lessonTargetPosted,
              curriculaMaterialsUsed: state.curriculaMaterialsUsed,
              regulationSpace: state.regulationSpace,
              characterTraitGraphic: state.characterTraitGraphic,
              structWhole: totalStructWhole,
              structSmall: totalStructSmall,
              structPartners: totalStructPartners,
              structIndividual: totalStructIndividual,
              wholeOtr: wholeOtrTotals,
              smallOtr: smallOtrTotals,
              customOtrTotals: customOtrTotals,
              customPraiseTotals: customPraiseTotals,
              specific: totalSpecific,
              general: totalGeneral,
              corrective: totalCorrective,
              redirect: totalRedirect,
              genCrit: totalGenCrit,
              indCrit: totalIndCrit,
              otrTotal: firstOtrTotal,
              ratioText: firstRatioText,
              otrRatioText: formatOtrRate(totalOtr, durationMs),
              praiseRatioText: formatPraiseRatio(positivePraise, negativePraise, durationMs),
              notes: state.notes,
              engagementChecks: state.engagementChecks,
              praiseRatings: state.praiseRatings,
              skipSELObservations: state.skipSELObservations,
              skipQuestions: state.skipQuestions,
              isSubsequentBlock: false,
              bins,
              events: firstModeEvents,
              includeOtr: isOtrActive,
              includePraise: isPraiseActive
          });
          sharedBlocks[0].durationMs = durationMs;
          state.mode = oldStateMode;
        };

        let activeRenderPromise = null;
        const renderImageBlob = async () => {
          if (cachedBlob) return cachedBlob;
          if (activeRenderPromise) return activeRenderPromise;
          
          activeRenderPromise = (async () => {
            try {
              updateFirstBlockLines();
              const composite = renderResultsCompositeSVG(sharedBlocks);
              const blob = await svgElementToPngBlob(composite, 2);
              cachedBlob = blob;
              if (cachedObjectUrl) {
                URL.revokeObjectURL(cachedObjectUrl);
              }
              cachedObjectUrl = URL.createObjectURL(blob);
              if (resultsGraphicImg) {
                resultsGraphicImg.src = cachedObjectUrl;
                resultsGraphicImg.style.display = "block";
              }
              if (resultsLoadingIndicator) {
                resultsLoadingIndicator.style.display = "none";
              }
              return blob;
            } catch (err) {
              console.error("Failed to render composite graphic:", err);
              if (resultsLoadingIndicator) {
                resultsLoadingIndicator.textContent = "Error generating graphic preview.";
              }
              throw err;
            } finally {
              activeRenderPromise = null;
            }
          })();

          return activeRenderPromise;
        };

        // Render immediately so the graphic is shown on screen and ready for mobile long-click
        renderImageBlob().catch(() => {});

        // 1. Copy Image button (direct copy to clipboard for iOS 16.7 & modern browsers)
        shareBtn.addEventListener("click", () => {
          shareStatus.textContent = "Copying image to clipboard...";
          shareBtn.disabled = true;

          updateFirstBlockLines();

          const blobPromise = (async () => {
            if (cachedBlob) return cachedBlob;
            return await renderImageBlob();
          })();

          const handleCopySuccess = () => {
            shareStatus.innerHTML = '<span style="color:#15803d; font-weight:bold;">✓ Image copied to clipboard!</span> You can now paste directly into an email or spreadsheet.';
            shareBtn.disabled = false;
            shareBtn.textContent = "Copied!";
            shareBtn.classList.add("copied");
            setTimeout(() => {
              shareBtn.textContent = "Copy Image";
              shareBtn.classList.remove("copied");
            }, 3500);
          };

          const handleCopyFallback = async () => {
            try {
              const blob = await blobPromise;
              const file = new File([blob], safeFilename(), { type: "image/png" });
              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file] });
                shareStatus.textContent = "Shared successfully!";
              } else {
                downloadBlob(blob, safeFilename());
                shareStatus.textContent = "Image downloaded!";
              }
            } catch (fallbackErr) {
              if (fallbackErr.name !== "AbortError") {
                const blob = await blobPromise;
                downloadBlob(blob, safeFilename());
                shareStatus.textContent = "Image downloaded!";
              } else {
                shareStatus.textContent = "";
              }
            }
            shareBtn.disabled = false;
            shareBtn.textContent = "Copy Image";
            shareBtn.classList.remove("copied");
          };

          // iOS 16.7 / WebKit requires navigator.clipboard.write called directly inside user event
          // with ClipboardItem taking a Promise resolving to a Blob.
          try {
            if (navigator.clipboard && navigator.clipboard.write) {
              const item = new ClipboardItem({ "image/png": blobPromise });
              navigator.clipboard.write([item])
                .then(handleCopySuccess)
                .catch(async (clipErr) => {
                  try {
                    const blob = await blobPromise;
                    const item2 = new ClipboardItem({ "image/png": blob });
                    await navigator.clipboard.write([item2]);
                    handleCopySuccess();
                  } catch (clipErr2) {
                    handleCopyFallback();
                  }
                });
            } else {
              handleCopyFallback();
            }
          } catch (err) {
            handleCopyFallback();
          }
        });
      }


      // Initialize App
      showSetup();
    });
  </script>
</body>
</html>
