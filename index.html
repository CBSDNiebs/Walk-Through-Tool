            requestAnimationFrame(syncNotes);
          });

          timerNotes.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "b" || e.key === "B" || e.code === "KeyB")) {
              e.preventDefault();
              e.stopPropagation();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();

              try {
                document.execCommand("styleWithCSS", false, false);
              } catch (err) {}

              let success = false;
              try {
                success = document.execCommand("bold", false, null);
              } catch (err) {
                success = false;
              }

              const sel = window.getSelection();
              if (!success && sel && sel.rangeCount > 0 && !sel.isCollapsed) {
                const range = sel.getRangeAt(0);
                if (timerNotes.contains(range.commonAncestorContainer)) {
                  try {
                    const b = document.createElement("b");
                    b.appendChild(range.extractContents());
                    range.insertNode(b);
                    sel.removeAllRanges();
                    const newRange = document.createRange();
                    newRange.selectNodeContents(b);
                    sel.addRange(newRange);
                  } catch (err) {}
                }
              }

              syncNotes();
              return;
            }
            if (e.key === "Enter") {
              requestAnimationFrame(autoResizeNotes);
            }
          });
          timerNotes.addEventListener("keyup", autoResizeNotes);
          timerNotes.addEventListener("change", autoResizeNotes);

          otrCold: new Array(minutes).fill(0),
          otrVolunteer: new Array(minutes).fill(0),
          otrOtherIndividual: new Array(minutes).fill(0),
          
          specific: new Array(minutes).fill(0),
          general: new Array(minutes).fill(0),
          corrective: new Array(minutes).fill(0),
          redirect: new Array(minutes).fill(0),
          genCrit: new Array(minutes).fill(0),
          indCrit: new Array(minutes).fill(0)
        };

        if (state.customOtrButtons && state.customOtrButtons.length > 0) {
          for (const cb of state.customOtrButtons) {
            bins[cb.id] = new Array(minutes).fill(0);
          }
        }
        if (state.customPraiseButtons && state.customPraiseButtons.length > 0) {
          for (const cb of state.customPraiseButtons) {
            bins[cb.id] = new Array(minutes).fill(0);
          }
        }

        for (const e of events){
          const idx = Math.min(minutes - 1, Math.max(0, Math.floor(e.tMs / 60000)));
          bins.total[idx] += 1;
          
          if (e.kind === "structWhole") bins.structWhole[idx] += 1;
          if (e.kind === "structSmall") bins.structSmall[idx] += 1;
          if (e.kind === "structPartners") bins.structPartners[idx] += 1;
          if (e.kind === "structIndividual") bins.structIndividual[idx] += 1;

          // Whole Group Buttons
          if (e.kind.startsWith("otrWhole_")) {
            if (!bins[e.kind]) bins[e.kind] = new Array(minutes).fill(0);
            bins[e.kind][idx] += 1;
          }

          // Small Group Buttons
          if (e.kind.startsWith("otrSmall_")) {
            if (!bins[e.kind]) bins[e.kind] = new Array(minutes).fill(0);
            bins[e.kind][idx] += 1;
          }

          // Legacy mappings
          if (e.kind === "otrChoral") { bins.otrWhole_choral[idx] += 1; bins.structWhole[idx] += 1; }
          if (e.kind === "otrCloze") { bins.otrWhole_cloze[idx] += 1; bins.structWhole[idx] += 1; }
          if (e.kind === "otrWhiteboard") { bins.otrWhole_whiteboard[idx] += 1; bins.structWhole[idx] += 1; }
          if (e.kind === "otrWritten") { bins.otrWhole_written[idx] += 1; bins.structWhole[idx] += 1; }
          if (e.kind === "otrNonverbal") { bins.otrWhole_nonverbal[idx] += 1; bins.structWhole[idx] += 1; }
          if (e.kind === "otrOtherWhole") { bins.otrWhole_tps[idx] += 1; bins.structWhole[idx] += 1; }

          if (e.kind === "otrGroupDisc") { bins.otrSmall_groupDisc[idx] += 1; bins.structSmall[idx] += 1; }
          if (e.kind === "otrTeamShare") { bins.otrSmall_teamShare[idx] += 1; bins.structSmall[idx] += 1; }
          if (e.kind === "otrOtherSmall") { bins.otrSmall_tps[idx] += 1; bins.structSmall[idx] += 1; }
          
          if (e.kind === "otrPrecision") { bins.otrSmall_precision[idx] += 1; bins.structPartners[idx] += 1; }
          if (e.kind === "otrElbow") { bins.otrSmall_elbow[idx] += 1; bins.structPartners[idx] += 1; }
          if (e.kind === "otrOtherPartner") { bins.otrSmall_elbow[idx] += 1; bins.structPartners[idx] += 1; }
          
          if (e.kind === "otrWarm") { bins.otrSmall_warm[idx] += 1; bins.structIndividual[idx] += 1; }
          if (e.kind === "otrCold") { bins.otrSmall_cold[idx] += 1; bins.structIndividual[idx] += 1; }
          if (e.kind === "otrVolunteer") { bins.otrSmall_volunteer[idx] += 1; bins.structIndividual[idx] += 1; }
          if (e.kind === "otrOtherIndividual") { bins.otrSmall_volunteer[idx] += 1; bins.structIndividual[idx] += 1; }

          if (state.customOtrButtons && state.customOtrButtons.length > 0) {
            const cb = state.customOtrButtons.find(c => c.id === e.kind);
            if (cb) {
              if (!bins[cb.id]) bins[cb.id] = new Array(minutes).fill(0);
              bins[cb.id][idx] += 1;
            }
          }

          if (state.customPraiseButtons && state.customPraiseButtons.length > 0) {
            const cb = state.customPraiseButtons.find(c => c.id === e.kind);
            if (cb) {
              if (!bins[cb.id]) bins[cb.id] = new Array(minutes).fill(0);
              bins[cb.id][idx] += 1;
            }
          }
          
          if (e.kind === "specific") bins.specific[idx] += 1;
          if (e.kind === "general") bins.general[idx] += 1;
          if (e.kind === "corrective") bins.corrective[idx] += 1;
          if (e.kind === "redirect") bins.redirect[idx] += 1;
          if (e.kind === "genCrit") bins.genCrit[idx] += 1;
          if (e.kind === "indCrit") bins.indCrit[idx] += 1;
        }

        return bins;
      }

      function getStructEvents(events) {
        const result = [];
        let cur = null;
        for (const e of events) {
          let sk = null;
          if (["structWhole", "structSmall", "structPartners", "structIndividual"].includes(e.kind)) {
            sk = e.kind;
          } else if (e.kind.startsWith("otrWhole_")) {
            sk = "structWhole";
          } else if (e.kind.startsWith("otrSmall_")) {
            sk = "structSmall";
          } else if (["otrChoral", "otrCloze", "otrWhiteboard", "otrWritten", "otrNonverbal", "otrOtherWhole"].includes(e.kind)) {
            sk = "structWhole";
          } else if (["otrGroupDisc", "otrTeamShare", "otrOtherSmall"].includes(e.kind)) {
            sk = "structSmall";
          } else if (["otrPrecision", "otrElbow", "otrOtherPartner"].includes(e.kind)) {
            sk = "structPartners";
          } else if (["otrWarm", "otrCold", "otrVolunteer", "otrOtherIndividual"].includes(e.kind)) {
            sk = "structIndividual";
          } else if (state.customOtrButtons && state.customOtrButtons.length > 0) {
            const cb = state.customOtrButtons.find(c => c.id === e.kind);
            if (cb) {
              if (cb.column === "whole") sk = "structWhole";
              else if (cb.column === "small") sk = "structSmall";
              else if (cb.column === "partner") sk = "structPartners";
              else if (cb.column === "individual") sk = "structIndividual";
            }
          }

          if (sk && sk !== cur) {
            cur = sk;
            result.push({ tMs: e.tMs, kind: sk });
          }
        }
        return result;
      }

      function el(ns, tag, attrs, text){
        const node = document.createElementNS(ns, tag);
        for (const [k,v] of Object.entries(attrs || {})) node.setAttribute(k, String(v));
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function pickIntTicks(yMax, targetCount){
        const ticks = new Set([0, yMax]);
        if (yMax <= targetCount){
          for (let i = 0; i <= yMax; i++) ticks.add(i);
          return Array.from(ticks).sort((a,b)=>a-b);
        }
        const step = Math.max(1, Math.round(yMax / targetCount));
        for (let v = 0; v <= yMax; v += step) ticks.add(v);
        ticks.add(yMax);
        return Array.from(ticks).sort((a,b)=>a-b);
      }

      function renderCircledRatioBadge(svg, centerX, baselineY, labelText, ratioText, isGoalMet, customColors = null, goalText = null) {
        const svgNS = "http://www.w3.org/2000/svg";
        const fontSans = "system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial";
        
        let strokeColor = "#6366f1";
        let fillColor = "#eef2ff";
        let textColor = "#312e81";

        if (customColors) {
          strokeColor = customColors.stroke;
          fillColor = customColors.fill;
          textColor = customColors.text;
        } else if (isGoalMet !== null) {
          strokeColor = isGoalMet ? "#16a34a" : "#dc2626";
          fillColor = isGoalMet ? "#f0fdf4" : "#fef2f2";
          textColor = isGoalMet ? "#15803d" : "#991b1b";
        }

        let measuredLabelW = 0;
        let measuredRatioW = 0;
        let measuredGoalW = 0;
        try {
          const mc = document.createElement("canvas").getContext("2d");
          mc.font = `bold 14px ${fontSans}`;
          measuredLabelW = mc.measureText(labelText).width;
          mc.font = `bold 15px ${fontSans}`;
          measuredRatioW = mc.measureText(ratioText).width;
          if (goalText) {
            mc.font = `600 13px ${fontSans}`;
            measuredGoalW = mc.measureText(goalText).width;
          }
        } catch (_) {}

        const charEstimateW = Math.ceil(labelText.length * 9.2);
        const labelW = Math.max(measuredLabelW, charEstimateW, 260);
        const ratioW = Math.max(measuredRatioW, Math.ceil(ratioText.length * 11), 32);
        const goalW = goalText ? Math.max(measuredGoalW, Math.ceil(goalText.length * 8)) : 0;

        const badgePadX = 14;
        const badgeW = Math.max(ratioW + (badgePadX * 2), 52);
        const badgeH = 26;
        const gap = 14;
        const totalW = labelW + gap + badgeW + (goalText ? (gap + goalW) : 0);
        const startX = centerX - (totalW / 2);

        // Label text
        svg.appendChild(el(svgNS, "text", {
          x: startX,
          y: baselineY,
          "text-anchor": "start",
          "font-size": 14,
          "font-family": fontSans,
          "font-weight": "bold",
          fill: "rgba(0,0,0,.85)"
        }, labelText));

        // Circle/pill border
        const badgeX = startX + labelW + gap;
        const badgeY = baselineY - 18;

        svg.appendChild(el(svgNS, "rect", {
          x: badgeX,
          y: badgeY,
          width: badgeW,
          height: badgeH,
          rx: badgeH / 2,
          ry: badgeH / 2,
          fill: fillColor,
          stroke: strokeColor,
          "stroke-width": 2
        }));

        // Ratio text
        svg.appendChild(el(svgNS, "text", {
          x: badgeX + (badgeW / 2),
          y: baselineY,
          "text-anchor": "middle",
          "font-size": 15,
          "font-family": fontSans,
          "font-weight": 800,
          fill: textColor
        }, ratioText));

        // Goal text right after the circled ratio badge
        if (goalText) {
          svg.appendChild(el(svgNS, "text", {
            x: badgeX + badgeW + gap,
            y: baselineY,
            "text-anchor": "start",
            "font-size": 13,
            "font-family": fontSans,
            "font-weight": 600,
            fill: "#64748b"
          }, goalText));
        }
      }

      function renderEngagementStackedBarChartSVG(events, durationMs) {
        const svgNS = "http://www.w3.org/2000/svg";
        
        const W = 800;
        const H = 530;
        const pad = { l: 48, r: 200, t: 50, b: 155 };
        const innerW = W - pad.l - pad.r;
        const innerH = H - pad.t - pad.b;

        const svg = el(svgNS, "svg", {
          viewBox: `0 0 ${W} ${H}`,
          width: W,
          height: H,
          style: "max-width:100%; height:auto; background:#fff; font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-size:14px;"
        });

        svg.appendChild(el(svgNS, "rect", { x: 0, y: 0, width: W, height: H, fill: "#fff" }));

        const categories = [
          { key: "structWhole", color: "#94a3b8", lineColor: "#475569", label: "Whole Group" },
          { key: "structSmall", color: "#cbd5e1", lineColor: "#64748b", label: "Small Group" },
          { key: "structPartners", color: "#e2e8f0", lineColor: "#94a3b8", label: "Partners" },
          { key: "structIndividual", color: "#f1f5f9", lineColor: "#cbd5e1", label: "Individual" }
        ];

        const maxMs = Math.max(durationMs, 60000);
        const rawMinutes = Math.ceil(maxMs / 60000);
        const numBlocks = Math.max(1, Math.ceil(rawMinutes / 5));
        const maxMinutes = numBlocks * 5;
        
        const x = (ms) => pad.l + (ms / (maxMinutes * 60000)) * innerW;

        // X-axis 1-minute grid lines and labels (avoids number collision on longer observations)
        for (let m = 0; m <= maxMinutes; m++) {
          const tx = x(m * 60000);
          svg.appendChild(el(svgNS, "line", {
            x1: tx, y1: pad.t, x2: tx, y2: pad.t + innerH,
            stroke: "rgba(0,0,0,.05)", "stroke-width": 1
          }));
          const shouldLabel = (maxMinutes <= 15) ? true : (m % 5 === 0 || m === 0 || m === maxMinutes);
          if (shouldLabel) {
            svg.appendChild(el(svgNS, "text", {
              x: tx, y: pad.t + innerH + 16, "text-anchor": "middle",
              "font-size": 13, fill: "rgba(0,0,0,.60)"
            }, String(m)));
          }
        }

        // Lighter grey lines at every 5-minute increment
        for (let m = 5; m <= maxMinutes; m += 5) {
          const gx = x(m * 60000);
          svg.appendChild(el(svgNS, "line", {
            x1: gx, y1: pad.t, x2: gx, y2: pad.t + innerH,
            stroke: "#d1d5db", "stroke-width": 1.5
          }));
          svg.appendChild(el(svgNS, "line", {
            x1: gx, y1: pad.t + innerH, x2: gx, y2: pad.t + innerH + 6,
            stroke: "#d1d5db", "stroke-width": 1.5
          }));
        }

        // 5-minute block ratio pills under the x-axis
        for (let b = 0; b < numBlocks; b++) {
          const bStartMin = b * 5;
          const bEndMin = (b + 1) * 5;
          const bStartMs = bStartMin * 60000;
          const bEndMs = bEndMin * 60000;
          const bCenterX = (x(bStartMs) + x(bEndMs)) / 2;
          const blockSpanW = x(bEndMs) - x(bStartMs);

          const bEvents = events.filter(e => e.tMs >= bStartMs && e.tMs < bEndMs);
          const bDurationMs = Math.max(0, Math.min(durationMs, bEndMs) - bStartMs);
          const effectiveDurationMs = bDurationMs > 0 ? bDurationMs : 300000;
          const bRatioText = formatOtrRatio(bEvents.length, effectiveDurationMs);

          const pillW = Math.max(28, Math.min(125, blockSpanW - (blockSpanW > 70 ? 10 : 4)));
          const pillH = 44;
          const pillX = bCenterX - (pillW / 2);
          const pillY = pad.t + innerH + 24;

          svg.appendChild(el(svgNS, "rect", {
            x: pillX, y: pillY, width: pillW, height: pillH,
            rx: 8, ry: 8,
            fill: "#eef2ff",
            stroke: "#6366f1",
            "stroke-width": 2
          }));

          const timeLabel = pillW >= 85 ? `${bStartMin}–${bEndMin} min` : `${bStartMin}–${bEndMin}m`;
          const timeFontSize = pillW >= 60 ? 12 : 10.5;
          svg.appendChild(el(svgNS, "text", {
            x: bCenterX, y: pillY + 16, "text-anchor": "middle",
            "font-size": timeFontSize, "font-weight": "700",
            fill: "#1f2937"
          }, timeLabel));

          const ratioLabel = pillW >= 95 ? `Ratio: ${bRatioText}` : bRatioText;
          const ratioFontSize = pillW >= 95 ? 14 : (pillW >= 60 ? 15 : 13);
          svg.appendChild(el(svgNS, "text", {
            x: bCenterX, y: pillY + 35, "text-anchor": "middle",
            "font-size": ratioFontSize, "font-weight": "800",
            fill: "#312e81"
          }, ratioLabel));
        }

        // X-axis label with clear separation below pills
        svg.appendChild(el(svgNS, "text", {
          x: pad.l + innerW / 2, y: pad.t + innerH + 90, "text-anchor": "middle",
          "font-size": 13, fill: "rgba(0,0,0,.60)"
        }, "Minutes"));

        // Single background row for the timeline
        svg.appendChild(el(svgNS, "rect", {
          x: pad.l, y: pad.t, width: innerW, height: innerH,
          fill: "rgba(0,0,0,.02)", stroke: "rgba(0,0,0,.1)", "stroke-width": 1
        }));

        // Draw events as continuous vertical bands extending horizontally
        for (let j = 0; j < events.length; j++) {
          const ev = events[j];
          const catIdx = categories.findIndex(c => c.key === ev.kind);
          if (catIdx >= 0) {
            const startMs = ev.tMs;
            const endMs = (j + 1 < events.length) ? events[j + 1].tMs : durationMs;
            const ex1 = x(startMs);
            const ex2 = x(endMs);
            
            svg.appendChild(el(svgNS, "rect", {
              x: ex1, y: pad.t, width: Math.max(0, ex2 - ex1), height: innerH,
              fill: categories[catIdx].color
            }));
            
            // Draw a slim line at the start of each event to mark the button click
            svg.appendChild(el(svgNS, "line", {
              x1: ex1, y1: pad.t, x2: ex1, y2: pad.t + innerH,
              stroke: categories[catIdx].lineColor, "stroke-width": 2
            }));
          }
        }

        // Draw vivid dots for engagement checks
        if (state.engagementChecks && state.engagementChecks.length > 0) {
          for (const check of state.engagementChecks) {
            const cx = x(check.timeMin * 60000);
            
            // Draw a vertical line for the check
            svg.appendChild(el(svgNS, "line", {
              x1: cx, y1: pad.t, x2: cx, y2: pad.t + innerH,
              stroke: "#e11d48", "stroke-width": 2, "stroke-dasharray": "4,4"
            }));
            
            // Draw the vivid dot at the top
            svg.appendChild(el(svgNS, "circle", {
              cx: cx, cy: pad.t - 6, r: 6,
              fill: "#e11d48"
            }));
            
            // Label the dot
            svg.appendChild(el(svgNS, "text", {
              x: cx, y: pad.t - 18, "text-anchor": "middle",
              "font-size": 14, "font-weight": "bold", fill: "#e11d48"
            }, `${check.offTaskStudents}/${check.totalStudents}`));
          }
        }
        
        // Axes borders
        svg.appendChild(el(svgNS, "line", { x1: pad.l, y1: pad.t + innerH, x2: pad.l + innerW, y2: pad.t + innerH, stroke: "rgba(0,0,0,.25)", "stroke-width": 1 }));
        svg.appendChild(el(svgNS, "line", { x1: pad.l, y1: pad.t, x2: pad.l, y2: pad.t + innerH, stroke: "rgba(0,0,0,.25)", "stroke-width": 1 }));

        // Legend on the right
        const lx = pad.l + innerW + 18;
        const lyStart = pad.t + 8;
        const lh = 22;
        
        categories.forEach((cat, i) => {
           const ly = lyStart + (i * lh);
           
           svg.appendChild(el(svgNS, "rect", {
              x: lx, y: ly - 12, width: 14, height: 14,
              fill: cat.color, rx: 2
           }));
           
           svg.appendChild(el(svgNS, "text", {
              x: lx + 20, y: ly, "text-anchor": "start",
              "font-size": 14, fill: "rgba(0,0,0,.75)"
           }, cat.label));
        });

        const totalEvents = events.length;
        const ratioText = formatOtrRatio(totalEvents, durationMs);
        renderCircledRatioBadge(
          svg,
          pad.l + innerW / 2,
          pad.t + innerH + 126,
          "Actual Lesson Structure per min (ratio):",
          ratioText,
          null,
          { stroke: "#6366f1", fill: "#eef2ff", text: "#312e81" }
        );

        return svg;
      }

      function renderOtrMultiLineChartSVG(events, durationMs, structEvents = []){

          ...bins.otrWhole_tps,
          ...bins.otrWhole_choral,
          ...bins.otrWhole_cloze,

          ...bins.otrSmall_choral,
          ...bins.otrSmall_cloze,
          ...bins.otrSmall_whiteboard,
          ...bins.otrSmall_written,
          ...bins.otrSmall_nonverbal,
          ...bins.otrSmall_groupDisc,

        );

        svg.setAttribute("width", String(W));
        svg.setAttribute("height", String(H));

        const lsCategories = [

          { key: "structIndividual", fill: "rgba(241, 245, 249, 0.46)", stroke: "#cbd5e1", label: "Individual" }
        ];

          ? structEvents
          : getStructEvents(state.otrEvents);

        if (sEvents.length > 0) {
          const xMs = (ms) => pad.l + (ms / (maxMinutes * 60000)) * innerW;
          for (let j = 0; j < sEvents.length; j++) {
            const ev = sEvents[j];
            const cat = lsCategories.find(c => c.key === ev.kind);
            if (cat) {
              const startMs = (j === 0) ? 0 : ev.tMs;
              const endMs = (j + 1 < sEvents.length) ? sEvents[j + 1].tMs : durationMs;
              const ex1 = Math.max(pad.l, xMs(startMs));
              const ex2 = Math.min(pad.l + innerW, xMs(endMs));
              const bandW = Math.max(0, ex2 - ex1);

              if (bandW > 0) {

                // Demarcation line at start of phase
                if (ex1 > pad.l) {
                  svg.appendChild(el(svgNS, "line", {
                    x1: ex1, y1: pad.t,

                // Crisp, highly readable label indicating group structure (e.g. Whole Group vs Small Group)
                let labelText = cat.label;
                if (bandW < 75 && bandW >= 42) {
                  labelText = cat.label === "Whole Group" ? "Whole Group" : (cat.label === "Small Group" ? "Small Group" : (cat.label === "Individual" ? "Individual" : "Partners"));
                } else if (bandW < 42 && bandW >= 24) {
                  labelText = cat.label === "Whole Group" ? "Whole" : (cat.label === "Small Group" ? "Small" : (cat.label === "Individual" ? "Indiv." : "Partners"));
                } else if (bandW < 24) {
                  labelText = cat.label === "Whole Group" ? "WG" : (cat.label === "Small Group" ? "SG" : (cat.label === "Individual" ? "Ind." : "P"));
                }

                if (bandW >= 18) {
                  const badgeW = Math.min(bandW - 2, Math.max(22, labelText.length * 6.5 + 10));
                  const badgeH = 17;
                  const badgeX = ex1 + (bandW - badgeW) / 2;
                  const badgeY = pad.t + 3;

                  // High-contrast clean pill tag behind text
                  svg.appendChild(el(svgNS, "rect", {
                    x: badgeX,
                    y: badgeY,
                    width: badgeW,
                    height: badgeH,
                    rx: 3.5,
                    fill: "rgba(255, 255, 255, 0.92)",
                    stroke: cat.stroke,
                    "stroke-width": 1
                  }));

                  svg.appendChild(el(svgNS, "text", {
                    x: badgeX + (badgeW / 2),
                    y: badgeY + 12,
                    "text-anchor": "middle",
                    "font-size": (bandW >= 60) ? 10.5 : 9.5,
                    "font-family": "system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial",
                    "font-weight": "700",
                    fill: "#1e293b"
                  }, labelText));
                }
              }
            }
          }
        }

        // Draw engagement check vertical indicators if present
        if (state.engagementChecks && state.engagementChecks.length > 0) {
          const xMs = (ms) => pad.l + (ms / (maxMinutes * 60000)) * innerW;
          for (const check of state.engagementChecks) {
            const cx = xMs(check.timeMin * 60000);
            svg.appendChild(el(svgNS, "line", {
              x1: cx, y1: pad.t, x2: cx, y2: pad.t + innerH,
              stroke: "#e11d48", "stroke-width": 1.5, "stroke-dasharray": "4 3"
            }));
            svg.appendChild(el(svgNS, "circle", {
              cx: cx, cy: pad.t - 5, r: 5,
              fill: "#e11d48"
            }));
            svg.appendChild(el(svgNS, "text", {
              x: cx, y: pad.t - 14, "text-anchor": "middle",
              "font-size": 12, "font-weight": "bold", fill: "#e11d48"
            }, `${check.offTaskStudents}/${check.totalStudents}`));
          }
        }

        for (const t of yTicks){
          const gy = y(t);
          svg.appendChild(el(svgNS, "line", { x1: pad.l, y1: gy, x2: pad.l + innerW, y2: gy, stroke: "rgba(0,0,0,.08)", "stroke-width": 1 }));
          svg.appendChild(el(svgNS, "text", {
            x: pad.l - 10, y: gy + 5, "text-anchor": "end",
            "font-size": 14, "font-family": "system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial",
            fill: "rgba(0,0,0,.65)"
          }, String(t)));
        }

        if (state.mode === "OTRs") {
          const y3 = y(3);
          const y5 = y(5);
          svg.appendChild(el(svgNS, "rect", {
            x: pad.l,
            y: y5,
            width: innerW,
            height: y3 - y5,
            fill: "rgba(31, 157, 85, 0.12)"
          }));
        }

        svg.appendChild(el(svgNS, "line", { x1: pad.l, y1: pad.t + innerH, x2: pad.l + innerW, y2: pad.t + innerH, stroke: "rgba(0,0,0,.25)", "stroke-width": 1 }));
        svg.appendChild(el(svgNS, "line", { x1: pad.l, y1: pad.t, x2: pad.l, y2: pad.t + innerH, stroke: "rgba(0,0,0,.25)", "stroke-width": 1 }));

        // X-axis minute labels
        for (let i = 0; i <= maxMinutes; i++){
          const shouldLabel = (maxMinutes <= 15) ? true : (i % 5 === 0 || i === 0 || i === maxMinutes);
          if (!shouldLabel) continue;
          const gx = x(i);
          svg.appendChild(el(svgNS, "text", {
            x: gx, y: pad.t + innerH + 16, "text-anchor": "middle",
            "font-size": 13, "font-family": "system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial",
            fill: "rgba(0,0,0,.65)"
          }, String(i)));
        }

        // Lighter grey vertical line at every 5-minute increment
        for (let m = 5; m <= maxMinutes; m += 5) {
          const gx = x(m);
          svg.appendChild(el(svgNS, "line", {
            x1: gx, y1: pad.t, x2: gx, y2: pad.t + innerH,
            stroke: "#d1d5db", "stroke-width": 1.5
          }));
          svg.appendChild(el(svgNS, "line", {
            x1: gx, y1: pad.t + innerH, x2: gx, y2: pad.t + innerH + 6,
            stroke: "#d1d5db", "stroke-width": 1.5
          }));
        }

        // 5-minute block ratio cards/pills under the x-axis
        for (let b = 0; b < numBlocks; b++) {
          const bStartMin = b * 5;
          const bEndMin = (b + 1) * 5;
          const bStartMs = bStartMin * 60000;
          const bEndMs = bEndMin * 60000;
          const bCenterX = (x(bStartMin) + x(bEndMin)) / 2;
          const blockSpanW = x(bEndMin) - x(bStartMin);

          const bEvents = events.filter(e => e.tMs >= bStartMs && e.tMs < bEndMs);
          const bDurationMs = Math.max(0, Math.min(durationMs, bEndMs) - bStartMs);
          const effectiveDurationMs = bDurationMs > 0 ? bDurationMs : 300000;

          let bRatioText = "";
          let bGoalMet = null;
          let bFill = "#eef2ff";
          let bStroke = "#6366f1";
          let bText = "#312e81";

          if (state.mode === "Praise") {
            const customPraiseIds = (state.customPraiseButtons || []).map(c => c.id);
            const bPos = bEvents.filter(e => ["specific", "general", "corrective", ...customPraiseIds].includes(e.kind)).length;
            const bNeg = bEvents.filter(e => ["redirect", "genCrit", "indCrit"].includes(e.kind)).length;
            bRatioText = formatPraiseRatio(bPos, bNeg, effectiveDurationMs);
            const rVal = bNeg === 0 ? bPos : Math.round(bPos / bNeg);
            bGoalMet = rVal >= 5;
            bStroke = bGoalMet ? "#16a34a" : "#dc2626";
            bFill = bGoalMet ? "#f0fdf4" : "#fef2f2";
            bText = bGoalMet ? "#15803d" : "#991b1b";
          } else if (state.mode === "Lesson Structure") {
            bRatioText = formatOtrRatio(bEvents.length, effectiveDurationMs);
            bStroke = "#6366f1";
            bFill = "#eef2ff";
            bText = "#312e81";
          } else {
            bRatioText = formatOtrRate(bEvents.length, effectiveDurationMs);
            const rNum = parseFloat(bRatioText);
            bGoalMet = !isNaN(rNum) && rNum >= 3;
            bStroke = bGoalMet ? "#16a34a" : "#dc2626";
            bFill = bGoalMet ? "#f0fdf4" : "#fef2f2";
            bText = bGoalMet ? "#15803d" : "#991b1b";
          }

          const pillW = Math.max(28, Math.min(125, blockSpanW - (blockSpanW > 70 ? 10 : 4)));
          const pillH = 44;
          const pillX = bCenterX - (pillW / 2);
          const pillY = pad.t + innerH + 24;

          svg.appendChild(el(svgNS, "rect", {
            x: pillX, y: pillY, width: pillW, height: pillH,
            rx: 8, ry: 8,
            fill: bFill, stroke: bStroke, "stroke-width": 2
          }));

          const timeLabel = pillW >= 85 ? `${bStartMin}–${bEndMin} min` : `${bStartMin}–${bEndMin}m`;
          const timeFontSize = pillW >= 60 ? 12 : 10.5;
          svg.appendChild(el(svgNS, "text", {
            x: bCenterX, y: pillY + 16, "text-anchor": "middle",
            "font-size": timeFontSize, "font-weight": "700",
            fill: "#1f2937"
          }, timeLabel));

          const formattedRatio = (pillW < 75) ? bRatioText.replace(" / min", "/m") : bRatioText;
          const ratioLabel = (state.mode === "OTRs" || state.mode === "All") ? formattedRatio : (pillW >= 95 ? `Ratio: ${formattedRatio}` : formattedRatio);
          const ratioFontSize = pillW >= 95 ? 14 : (pillW >= 60 ? 15 : 13);
          svg.appendChild(el(svgNS, "text", {
            x: bCenterX, y: pillY + 35, "text-anchor": "middle",
            "font-size": ratioFontSize, "font-weight": "800",
            fill: bText
          }, ratioLabel));
        }

        function addSeries(series, stroke, strokeWidth, withPoints, dashArray, opacity = "1"){
          if (!series) return;
          const hasData = series.some(v => v > 0);
          if (!hasData && !withPoints) return;
          const pts = [];
          for (let i = 1; i <= n; i++){
            const val = series[i - 1];
            pts.push({ mx: x(i), my: y(val), val });
          }
          const pathD = pts.map((p, idx) => `${idx === 0 ? "M" : "L"} ${p.mx.toFixed(2)} ${p.my.toFixed(2)}`).join(" ");
          const attrs = {
            d: pathD,
            fill: "none",
            stroke,
            "stroke-width": strokeWidth,
            "stroke-linecap": "round",
            "stroke-linejoin": "round",
            opacity: String(opacity)
          };
          if (dashArray) attrs["stroke-dasharray"] = dashArray;
          svg.appendChild(el(svgNS, "path", attrs));

          // Draw distinct data points for any minutes with observations to maximize visibility over the lesson structure
          for (const p of pts){
            if (p.val > 0 || withPoints){
              svg.appendChild(el(svgNS, "circle", {
                cx: p.mx,
                cy: p.my,
                r: strokeWidth >= 3.5 ? 4.5 : 3.5,
                fill: stroke,
                stroke: "#ffffff",
                "stroke-width": 1.5,
                opacity: String(opacity)
              }));
            }
          }
        }

        const css = getComputedStyle(document.documentElement);
        const cTotal = css.getPropertyValue("--otr-total").trim() || "rgba(0,0,0,0.2)";
        
        const cStructWhole = css.getPropertyValue("--struct-whole").trim() || "#94a3b8";
        const cStructSmall = css.getPropertyValue("--struct-small").trim() || "#cbd5e1";
        const cStructPartners = css.getPropertyValue("--struct-partners").trim() || "#e2e8f0";
        const cStructIndividual = css.getPropertyValue("--struct-individual").trim() || "#f1f5f9";

        // Whole Group Colors (13 shades of purple - Descending Darkness to Lightness)
        const cOtrWgTps = css.getPropertyValue("--otr-wg-tps").trim() || "#2e0750";
        const cOtrWgChoral = css.getPropertyValue("--otr-wg-choral").trim() || "#380961";
        const cOtrWgCloze = css.getPropertyValue("--otr-wg-cloze").trim() || "#420c71";
        const cOtrWgWhiteboard = css.getPropertyValue("--otr-wg-whiteboard").trim() || "#4c0f81";
        const cOtrWgWritten = css.getPropertyValue("--otr-wg-written").trim() || "#561291";
        const cOtrWgNonverbal = css.getPropertyValue("--otr-wg-nonverbal").trim() || "#6015a1";
        const cOtrWgGroupdisc = css.getPropertyValue("--otr-wg-groupdisc").trim() || "#6a19b0";
        const cOtrWgTeamshare = css.getPropertyValue("--otr-wg-teamshare").trim() || "#741dbf";
        const cOtrWgPrecision = css.getPropertyValue("--otr-wg-precision").trim() || "#7e22ce";
        const cOtrWgElbow = css.getPropertyValue("--otr-wg-elbow").trim() || "#8729da";
        const cOtrWgWarm = css.getPropertyValue("--otr-wg-warm").trim() || "#903bdb";
        const cOtrWgCold = css.getPropertyValue("--otr-wg-cold").trim() || "#994ddc";
        const cOtrWgVolunteer = css.getPropertyValue("--otr-wg-volunteer").trim() || "#a25ede";
        const cOtrWgCustom = css.getPropertyValue("--otr-wg-custom").trim() || "#ab6fe0";

        // Small Group Colors (13 shades of blue - Descending Darkness to Lightness)
        const cOtrSgTps = css.getPropertyValue("--otr-sg-tps").trim() || "#04234e";
        const cOtrSgChoral = css.getPropertyValue("--otr-sg-choral").trim() || "#062b5f";
        const cOtrSgCloze = css.getPropertyValue("--otr-sg-cloze").trim() || "#083370";
        const cOtrSgWhiteboard = css.getPropertyValue("--otr-sg-whiteboard").trim() || "#0a3c81";
        const cOtrSgWritten = css.getPropertyValue("--otr-sg-written").trim() || "#0d4491";
        const cOtrSgNonverbal = css.getPropertyValue("--otr-sg-nonverbal").trim() || "#104ca2";
        const cOtrSgGroupdisc = css.getPropertyValue("--otr-sg-groupdisc").trim() || "#1355b2";
        const cOtrSgTeamshare = css.getPropertyValue("--otr-sg-teamshare").trim() || "#165dc1";
        const cOtrSgPrecision = css.getPropertyValue("--otr-sg-precision").trim() || "#1a66d1";
        const cOtrSgElbow = css.getPropertyValue("--otr-sg-elbow").trim() || "#1e6fe0";
        const cOtrSgWarm = css.getPropertyValue("--otr-sg-warm").trim() || "#2f7ae1";
        const cOtrSgCold = css.getPropertyValue("--otr-sg-cold").trim() || "#4285e2";
        const cOtrSgVolunteer = css.getPropertyValue("--otr-sg-volunteer").trim() || "#5490e3";
        const cOtrSgCustom = css.getPropertyValue("--otr-sg-custom").trim() || "#669be4";

        const cSpecific = css.getPropertyValue("--praise-specific").trim() || "#1f9d55";
        const cGeneral = css.getPropertyValue("--praise-general").trim() || "#27ae60";
        const cCorrective = css.getPropertyValue("--praise-corrective").trim() || "#3b82f6";
        const cRedirect = css.getPropertyValue("--praise-redirect").trim() || "#f97316";
        const cGenCrit = css.getPropertyValue("--praise-gen-crit").trim() || "#ef4444";
        const cIndCrit = css.getPropertyValue("--praise-ind-crit").trim() || "#b91c1c";

        if (state.mode === "Praise") {
          addSeries(bins.indCrit, cIndCrit, 2.6, false, null, "1");
          addSeries(bins.genCrit, cGenCrit, 2.6, false, null, "1");
          addSeries(bins.redirect, cRedirect, 2.6, false, null, "1");
          addSeries(bins.corrective, cCorrective, 2.8, false, null, "1");
          addSeries(bins.general, cGeneral, 2.8, false, null, "1");
          addSeries(bins.specific, cSpecific, 3.8, false, null, "1");

          if (state.customPraiseButtons && state.customPraiseButtons.length > 0) {
            for (const cb of state.customPraiseButtons) {
              if (bins[cb.id]) {
                addSeries(bins[cb.id], "#0d9488", 2.6, false, "3 2", "1");
              }
            }
          }
        } else if (state.mode === "Lesson Structure") {
          addSeries(bins.structIndividual, cStructIndividual, 2.6, false, null, "1");
          addSeries(bins.structPartners, cStructPartners, 2.6, false, null, "1");
          addSeries(bins.structSmall, cStructSmall, 2.8, false, null, "1");
          addSeries(bins.structWhole, cStructWhole, 3.8, false, null, "1");
        } else {
          // Whole Group Series (shades of purple)
          // Column 1
          addSeries(bins.otrWhole_cloze, cOtrWgCloze, 2.6, false, null, "1");
          addSeries(bins.otrWhole_nonverbal, cOtrWgNonverbal, 2.6, false, null, "1");
          addSeries(bins.otrWhole_written, cOtrWgWritten, 2.8, false, null, "1");
          addSeries(bins.otrWhole_choral, cOtrWgChoral, 3.0, false, null, "1");
          // Column 2
          addSeries(bins.otrWhole_tps, cOtrWgTps, 2.6, false, null, "1");
          addSeries(bins.otrWhole_elbow, cOtrWgElbow, 2.6, false, null, "1");
          addSeries(bins.otrWhole_precision, cOtrWgPrecision, 2.8, false, null, "1");
          // Column 3
          addSeries(bins.otrWhole_volunteer, cOtrWgVolunteer, 2.6, false, null, "1");
          addSeries(bins.otrWhole_cold, cOtrWgCold, 2.6, false, null, "1");
          addSeries(bins.otrWhole_warm, cOtrWgWarm, 2.8, false, null, "1");
          if (bins.otrWhole_whiteboard.some(v => v > 0)) addSeries(bins.otrWhole_whiteboard, cOtrWgWhiteboard, 2.6, false, null, "1");
          if (bins.otrWhole_groupDisc.some(v => v > 0)) addSeries(bins.otrWhole_groupDisc, cOtrWgGroupdisc, 2.6, false, null, "1");
          if (bins.otrWhole_teamShare.some(v => v > 0)) addSeries(bins.otrWhole_teamShare, cOtrWgTeamshare, 2.6, false, null, "1");

          // Small Group Series (shades of blue)
          // Column 1
          addSeries(bins.otrSmall_cloze, cOtrSgCloze, 2.6, false, null, "1");
          addSeries(bins.otrSmall_nonverbal, cOtrSgNonverbal, 2.6, false, null, "1");
          addSeries(bins.otrSmall_written, cOtrSgWritten, 2.8, false, null, "1");
          addSeries(bins.otrSmall_choral, cOtrSgChoral, 3.0, false, null, "1");
          // Column 2
          addSeries(bins.otrSmall_tps, cOtrSgTps, 2.6, false, null, "1");
          addSeries(bins.otrSmall_elbow, cOtrSgElbow, 2.6, false, null, "1");
          addSeries(bins.otrSmall_precision, cOtrSgPrecision, 2.8, false, null, "1");
          // Column 3
          addSeries(bins.otrSmall_volunteer, cOtrSgVolunteer, 2.6, false, null, "1");
          addSeries(bins.otrSmall_cold, cOtrSgCold, 2.6, false, null, "1");
          addSeries(bins.otrSmall_warm, cOtrSgWarm, 2.8, false, null, "1");
          if (bins.otrSmall_whiteboard.some(v => v > 0)) addSeries(bins.otrSmall_whiteboard, cOtrSgWhiteboard, 2.6, false, null, "1");
          if (bins.otrSmall_groupDisc.some(v => v > 0)) addSeries(bins.otrSmall_groupDisc, cOtrSgGroupdisc, 2.6, false, null, "1");
          if (bins.otrSmall_teamShare.some(v => v > 0)) addSeries(bins.otrSmall_teamShare, cOtrSgTeamshare, 2.6, false, null, "1");

          if (state.customOtrButtons && state.customOtrButtons.length > 0) {
            for (const cb of state.customOtrButtons) {
              if (bins[cb.id]) {
                const col = cb.column === "small" ? cOtrSgCustom : cOtrWgCustom;
                addSeries(bins[cb.id], col, 2.6, false, "3 2", "1");
              }
            }
          }
        }

        // X-axis label with clear separation below pills
        svg.appendChild(el(svgNS, "text", {
          x: pad.l + innerW / 2, y: pad.t + innerH + 90, "text-anchor": "middle",
          "font-size": 13, "font-family": "system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial",
          fill: "rgba(0,0,0,.60)"
        }, "Minutes"));

        if (state.mode === "Praise") {
          const totalSpecific = bins.specific.reduce((a, b) => a + b, 0);
          const totalGeneral = bins.general.reduce((a, b) => a + b, 0);
          const totalCorrective = bins.corrective.reduce((a, b) => a + b, 0);
          const totalRedirect = bins.redirect.reduce((a, b) => a + b, 0);
          const totalGenCrit = bins.genCrit.reduce((a, b) => a + b, 0);
          const totalIndCrit = bins.indCrit.reduce((a, b) => a + b, 0);
          let totalCustomP = 0;
          if (state.customPraiseButtons) {
            for (const cb of state.customPraiseButtons) {
              if (bins[cb.id]) totalCustomP += bins[cb.id].reduce((a, b) => a + b, 0);
            }
          }
          const positive = totalSpecific + totalGeneral + totalCorrective + totalCustomP;
          const negative = totalRedirect + totalGenCrit + totalIndCrit;
          const ratioText = formatPraiseRatio(positive, negative, durationMs);
          const ratioValue = negative === 0 ? positive : Math.round(positive / negative);
          const isGoalMet = ratioValue >= 5;

          renderCircledRatioBadge(
            svg,
            pad.l + innerW / 2,
            pad.t + innerH + 130,
            "Average Positive to Negative ratio:",
            ratioText,
            isGoalMet,
            null,
            "Goal: 5:1  +:- feedback"
          );
        } else if (state.mode === "OTRs") {
          const totalOtr = bins.total.reduce((a, b) => a + b, 0);
          const rateText = formatOtrRate(totalOtr, durationMs);
          const rateNum = parseFloat(rateText);
          const isGoalMet = !isNaN(rateNum) && rateNum >= 3;

          renderCircledRatioBadge(
            svg,
            pad.l + innerW / 2,
            pad.t + innerH + 130,
            "Opportunities to Respond per minute:",
            rateText,
            isGoalMet,
            null,
            "Goal: 3-5 OTRs/min"
          );
        } else if (state.mode === "Lesson Structure") {
          const totalEvents = events.length;
          const ratioText = formatOtrRatio(totalEvents, durationMs);
          renderCircledRatioBadge(
            svg,
            pad.l + innerW / 2,
            pad.t + innerH + 126,
            "Actual Lesson Structure per min (ratio):",
            ratioText,
            null,
            { stroke: "#6366f1", fill: "#eef2ff", text: "#312e81" }
          );
        }

        svg.appendChild(el(svgNS, "text", {
          x: 18, y: pad.t + innerH / 2, "text-anchor": "middle",
          "font-size": 14, "font-family": "system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial",
          fill: "rgba(0,0,0,.60)",
          transform: `rotate(-90 18 ${pad.t + innerH / 2})`
        }, state.mode === "Praise" ? "Instructional Feedback per min" : state.mode === "Lesson Structure" ? "Lesson Structure per min" : "Opportunities to Respond per min"));

        const lx = pad.l + innerW + 14;
        const ly = pad.t + 4;
        const lh = 17;
        const font = "system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial";

        function legendRow(i, color, label, dashArray, strokeWidth = 3, opacity = "1", lineSpacing = lh){
          const y0 = ly + i * lineSpacing;
          const attrs = { x1: lx, y1: y0, x2: lx + 20, y2: y0, stroke: color, "stroke-width": strokeWidth, "stroke-linecap": "round", opacity: String(opacity) };
          if (dashArray) attrs["stroke-dasharray"] = dashArray;
          svg.appendChild(el(svgNS, "line", attrs));
          svg.appendChild(el(svgNS, "text", {
            x: lx + 26, y: y0 + 4, "text-anchor": "start",
            "font-size": 11, "font-family": font,
            fill: "rgba(0,0,0,.85)"
          }, label));
        }

        let nextLegendY = ly;

        if (state.mode === "Praise") {
          legendRow(0, cSpecific, "Specific Praise", null, 3.8, "1");
          legendRow(1, cGeneral, "General Praise", null, 2.8, "1");
          legendRow(2, cCorrective, "Corrective Feedback", null, 2.8, "1");
          legendRow(3, cRedirect, "Redirective Statements", null, 2.6, "1");
          legendRow(4, cGenCrit, "General Criticism", null, 2.6, "1");
          legendRow(5, cIndCrit, "Individual Criticism", null, 2.6, "1");
          let pIdx = 6;
          if (state.customPraiseButtons && state.customPraiseButtons.length > 0) {
            for (const cb of state.customPraiseButtons) {
              legendRow(pIdx++, "#0d9488", cb.label, "3 2", 2.6, "1", lh);
            }
          }
          nextLegendY = ly + pIdx * lh + 12;
        } else if (state.mode === "Lesson Structure") {
          legendRow(0, cStructWhole, "Whole Group", null, 3.8, "1");
          legendRow(1, cStructSmall, "Small Group", null, 2.8, "1");
          legendRow(2, cStructPartners, "Partners", null, 2.6, "1");
          legendRow(3, cStructIndividual, "Individual", null, 2.6, "1");
          nextLegendY = ly + 4 * lh + 12;
        } else {
          // OTR legend: grouped by Whole Group (shades of purple) and Small Group (shades of blue)

      function svgElementToPngBlob(svgEl, scale = 2){
        return new Promise((resolve, reject) => {
          const serializer = new XMLSerializer();
          const svgText = serializer.serializeToString(svgEl);
          const svgBlob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
          const url = URL.createObjectURL(svgBlob);

          const img = new Image();
          img.onload = () => {
            const w = Number(svgEl.getAttribute("width")) || 800;
            const h = Number(svgEl.getAttribute("height")) || 400;

            const canvas = document.createElement("canvas");
            // Standard crisp 2x resolution (1600px width), completely safe for iOS Safari memory limits
            const s = Math.min(2, Math.max(1, scale || 2));

            canvas.width = Math.floor(w * s);
            canvas.height = Math.floor(h * s);

            const ctx = canvas.getContext("2d");
            ctx.setTransform(s, 0, 0, s, 0, 0);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);

            URL.revokeObjectURL(url);

            canvas.toBlob((blob) => {
              if (!blob) return reject(new Error("PNG render failed"));
              resolve(blob);
            }, "image/png");
          };

          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("Image load failed"));
          };

          img.src = url;
        });
      }

      function blobToBase64(blob) {
        return new Promise((resolve, _) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.readAsDataURL(blob);
        });
      }

      function downloadBlob(blob, filename){
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }

      function formatOtrRate(otrTotal, durationMs){
        if (!durationMs || durationMs <= 0) return `0 / min`;
        const totalMinutes = Math.max(1, Math.ceil(durationMs / 60000));
        const rate = otrTotal / totalMinutes;
        const rounded = Math.round(rate * 10) / 10;
        const display = (rounded % 1 === 0) ? String(rounded) : rounded.toFixed(1);
        return `${display} / min`;
      }

      function formatOtrRatio(otrTotal, durationMs){
        if (!durationMs || durationMs <= 0) return `0:1`;
        const totalMinutes = Math.max(1, Math.ceil(durationMs / 60000));
        const rate = otrTotal / totalMinutes;
        const rounded = Math.round(rate * 10) / 10;
        const display = (rounded % 1 === 0) ? String(rounded) : rounded.toFixed(1);
        return `${display}:1`;
      }

      function formatPraiseRatio(positive, negative, durationMs) {
        if (negative === 0) return `${positive}:0`;
        const ratio = Math.round(positive / negative);
        return `${ratio}:1`;
      }

      function addWrappedResultLine(targetLines, text, maxChars = 85) {
        if (!text) {
          targetLines.push("");
          return;
        }
        if (text.length <= maxChars) {
          targetLines.push(text);
          return;
        }
        const words = text.split(" ");
        let cur = "";
        let isFirst = true;
        for (const word of words) {
          if (isFirst) {
            if ((cur + (cur ? " " : "") + word).length > maxChars) {
              if (cur) targetLines.push(cur);
              cur = "  " + word;
              isFirst = false;
            } else {
              cur += (cur ? " " : "") + word;
            }
          } else {
            if ((cur + " " + word).length > maxChars) {
              targetLines.push(cur);
              cur = "  " + word;
            } else {
              cur += " " + word;
            }
          }
        }
        if (cur) targetLines.push(cur);

        if (kind === "otrWhole_warm") return { group: "whole", label: "Warm Call", color: "#14532d" };
        if (kind === "otrWhole_cold") return { group: "whole", label: "Cold Call", color: "#15803d" };
        if (kind === "otrWhole_volunteer") return { group: "whole", label: "Volunteer", color: "#22c55e" };
        if (kind === "otrWhole_whiteboard" || kind === "otrWhiteboard") return { group: "whole", label: "White Board Response", color: "#047857" };
        if (kind === "otrWhole_groupDisc") return { group: "whole", label: "Group Discussion", color: "#065f46" };
        if (kind === "otrWhole_teamShare") return { group: "whole", label: "Team Share", color: "#0f766e" };

        if (kind === "otrSmall_choral") return { group: "small", label: "Choral Response", color: "#0a4282" };
        if (kind === "otrSmall_written") return { group: "small", label: "Written Responses", color: "#1565c0" };
        if (kind === "otrSmall_nonverbal") return { group: "small", label: "Nonverbal Response", color: "#0284c7" };
        if (kind === "otrSmall_cloze") return { group: "small", label: "Cloze Reading", color: "#0369a1" };
        if (kind === "otrSmall_precision") return { group: "small", label: "Precision Partner", color: "#032b43" };
        if (kind === "otrSmall_elbow") return { group: "small", label: "Elbow Partner", color: "#0369a1" };
        if (kind === "otrSmall_tps") return { group: "small", label: "Think, Pair, Share", color: "#38bdf8" };
        if (kind === "otrSmall_warm") return { group: "small", label: "Warm Call", color: "#1e3a8a" };
        if (kind === "otrSmall_cold") return { group: "small", label: "Cold Call", color: "#2563eb" };
        if (kind === "otrSmall_volunteer" || kind === "otrVolunteer" || kind === "otrOtherIndividual") return { group: "small", label: "Volunteer", color: "#60a5fa" };
        if (kind === "otrSmall_whiteboard") return { group: "small", label: "White Board Response", color: "#0a3c81" };
        if (kind === "otrSmall_groupDisc" || kind === "otrGroupDisc") return { group: "small", label: "Group Discussion", color: "#1355b2" };
        if (kind === "otrSmall_teamShare" || kind === "otrTeamShare") return { group: "small", label: "Team Share", color: "#165dc1" };

        // Custom buttons
        if (state.customOtrButtons && state.customOtrButtons.length > 0) {
          const customMatch = state.customOtrButtons.find(c => c.id === kind);
          if (customMatch) {
            const isWhole = customMatch.column === "whole";
            return {
              group: isWhole ? "whole" : "small",
              label: customMatch.label || "Custom OTR",
              color: isWhole ? "#10b981" : "#60a5fa"
            };
          }
        }

        if (kind.startsWith("otrWhole") || kind.startsWith("otr_whole")) {
          return { group: "whole", label: "Whole Group OTR", color: "#10b981" };
        }
        return { group: "small", label: "Small Group OTR", color: "#38bdf8" };
      }

      function renderResultsCompositeSVG(blocks){
        const svgNS = "http://www.w3.org/2000/svg";
        const W = 800;
        const pad = 16;
        const lineH = 25;
        
        const fontSans = "system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial";

        let measureCtx = null;
        try {
          const measureCanvas = document.createElement("canvas");
          measureCtx = measureCanvas.getContext("2d");
        } catch (_) {}

        // Calculate heights and per-line Y positions: each block has its text lines + its chartSvg in original location
        let totalH = pad;
        for (const block of blocks) {
          let lineY = pad + 18;
          block.lineYPositions = [];
          for (let i = 0; i < block.lines.length; i++) {
            const rawLine = block.lines[i];
            const lineStr = typeof rawLine === "string" ? rawLine : (rawLine && rawLine.text ? rawLine.text : "");
            if (lineStr === "__NOTES_END__") {
              block.lineYPositions.push(lineY);
              continue;
            }
            const isRatio = lineStr.startsWith("Opportunities to Respond per min") ||
                            lineStr.startsWith("Average Positive to Negative ratio:") ||
                            lineStr.includes("(ratio):");
            block.lineYPositions.push(lineY);
            if (isRatio) {
              lineY += 30;
            } else if (i === 0) {
              lineY += 28;
            } else {
              lineY += 25;
            }
          }
          block.textBlockH = lineY + 14;
          totalH += block.textBlockH;
          if (block.chartSvg) {
            block.chartH = Number(block.chartSvg.getAttribute("height")) || 465;
            totalH += block.chartH + 28;
          } else {
            block.chartH = 0;
          }
        }

        const root = document.createElementNS(svgNS, "svg");
        root.setAttribute("xmlns", svgNS);
        root.setAttribute("viewBox", `0 0 ${W} ${totalH}`);
        root.setAttribute("width", String(W));
        root.setAttribute("height", String(totalH));
        root.appendChild(el(svgNS, "rect", { x: 0, y: 0, width: W, height: totalH, fill: "#fff" }));

        let currentYOffset = 0;

        for (const block of blocks) {
          // Identify notes lines range in this block
          let notesStartIdx = -1;
          let notesEndIdx = -1;
          for (let i = 0; i < block.lines.length; i++) {
            const rawLine = block.lines[i];
            const lineStr = typeof rawLine === "string" ? rawLine : (rawLine && rawLine.text ? rawLine.text : "");
            if (lineStr === "Notes:") {
              notesStartIdx = i;
              notesEndIdx = i;
            } else if (notesStartIdx !== -1) {
              if (lineStr === "__NOTES_END__") {
                notesEndIdx = Math.max(notesStartIdx, i - 1);
                break;
              } else if (lineStr.startsWith("  ")) {
                notesEndIdx = i;
              } else if (lineStr === "Whole Group:" || lineStr === "Small Group:" || lineStr === "Instructional Feedback:" || lineStr === "Observations:") {
                let lastNote = i - 1;
                while (lastNote > notesStartIdx && (block.lines[lastNote] === "" || block.lines[lastNote] === "__NOTES_END__")) {
                  lastNote--;
                }
                notesEndIdx = Math.max(notesStartIdx, lastNote);
                break;
              }
            }
          }
          if (notesStartIdx !== -1 && notesEndIdx === -1) {
            notesEndIdx = notesStartIdx;
          }

          // Draw notes box and thin grey line bisecting the space between the box and whole group (or next raw data)
          if (notesStartIdx !== -1) {
            const boxTopY = currentYOffset + block.lineYPositions[notesStartIdx] - 16;
            const boxBottomY = currentYOffset + block.lineYPositions[notesEndIdx] + 12;
            const boxHeight = boxBottomY - boxTopY;
            const boxX = pad - 6;
            const boxW = W - (pad * 2) + 12;

            root.appendChild(el(svgNS, "rect", {
              x: boxX,
              y: boxTopY,
              width: boxW,
              height: boxHeight,
              fill: "rgba(248, 250, 252, 0.95)",
              stroke: "#94a3b8",
              "stroke-width": 1.5,
              rx: 8,
              ry: 8
            }));

            // Find next non-empty line after the notes box (e.g. Whole Group, Small Group, or Instructional Feedback)
            let nextLineIdx = -1;
            for (let i = notesEndIdx + 1; i < block.lines.length; i++) {
              const str = typeof block.lines[i] === "string" ? block.lines[i] : (block.lines[i]?.text || "");
              if (str !== "__NOTES_END__" && str.trim() !== "") {
                nextLineIdx = i;
                break;
              }
            }

            if (nextLineIdx !== -1) {
              const nextSectionY = currentYOffset + block.lineYPositions[nextLineIdx] - 16;
              const dividerY = Math.round(boxBottomY + (nextSectionY - boxBottomY) / 2);

              root.appendChild(el(svgNS, "line", {
                x1: pad,
                y1: dividerY,
                x2: W - pad,
                y2: dividerY,
                stroke: "#94a3b8",
                "stroke-width": 1.25
              }));
            }
          }

          // Measure max label width for summary ratios in this block so pills align to the exact same column
          let maxSummaryLabelW = 320;
          for (const l of block.lines) {
            const s = typeof l === "string" ? l : (l && l.text ? l.text : "");
            if (s.startsWith("Opportunities to Respond per min") || s.startsWith("Average Positive to Negative ratio:") || s.includes("(ratio):")) {
              const colon = s.indexOf(":");
              const lbl = s.substring(0, colon + 1).trim();
              let mW = 0;
              try {
                if (measureCtx) {
                  measureCtx.font = `bold 14px ${fontSans}`;
                  mW = measureCtx.measureText(lbl).width;
                }
              } catch (_) {}
              const cW = Math.ceil(lbl.length * 9.2);
              maxSummaryLabelW = Math.max(maxSummaryLabelW, mW, cW);
            }
          }
          const sharedRatioBadgeX = pad + maxSummaryLabelW + 14;

          for (let i = 0; i < block.lines.length; i++){
            const isTitle = i === 0;
            const lineItem = block.lines[i];
            const lineText = typeof lineItem === "string" ? lineItem : (lineItem && lineItem.text ? lineItem.text : "");
            const yPos = currentYOffset + (block.lineYPositions ? block.lineYPositions[i] : (pad + (i + 1) * lineH));

            if (!lineText || lineText === "__NOTES_END__") {
              continue;
            }

            // Ratio or rate line with circled/bordered actual value (never overlapping)
            const isRatioSummaryLine = lineText.startsWith("Opportunities to Respond per min") ||
                                       lineText.startsWith("Average Positive to Negative ratio:") ||
                                       lineText.includes("(ratio):");
            if (isRatioSummaryLine) {
              const colonIdx = lineText.indexOf(":");
              const label = lineText.substring(0, colonIdx + 1).trim();
              const ratioVal = lineText.substring(colonIdx + 1).trim();

              let measuredRatioW = 0;
              try {
                if (measureCtx) {
                  measureCtx.font = `bold 15px ${fontSans}`;
                  measuredRatioW = measureCtx.measureText(ratioVal).width;
                }
              } catch (_) {}

              const ratioW = Math.max(measuredRatioW, Math.ceil(ratioVal.length * 10), 28);

              let isGoalMet = false;
              let strokeColor = "#dc2626";
              let fillColor = "#fef2f2";
              let textColor = "#991b1b";

              const rateNum = parseFloat(ratioVal);
              if (lineText.includes("Positive to Negative")) {
                isGoalMet = !isNaN(rateNum) && rateNum >= 5;
                strokeColor = isGoalMet ? "#16a34a" : "#dc2626";
                fillColor = isGoalMet ? "#f0fdf4" : "#fef2f2";
                textColor = isGoalMet ? "#15803d" : "#991b1b";
              } else if (lineText.startsWith("Opportunities to Respond")) {
                isGoalMet = !isNaN(rateNum) && rateNum >= 3;
                strokeColor = isGoalMet ? "#16a34a" : "#dc2626";
                fillColor = isGoalMet ? "#f0fdf4" : "#fef2f2";
                textColor = isGoalMet ? "#15803d" : "#991b1b";
              } else {
                strokeColor = isGoalMet ? "#16a34a" : "#dc2626";
                fillColor = isGoalMet ? "#f0fdf4" : "#fef2f2";
                textColor = isGoalMet ? "#15803d" : "#991b1b";
              }

              // Subtle row background (height 26, leaving 4px margin between consecutive rows)
              root.appendChild(el(svgNS, "rect", {
                x: pad - 4,
                y: yPos - 19,
                width: W - (pad * 2) + 8,
                height: 26,
                fill: (lineText.includes("Positive to Negative") || lineText.startsWith("Opportunities to Respond"))
                  ? (isGoalMet ? "rgba(240, 253, 244, 0.5)" : "rgba(254, 242, 242, 0.5)")
                  : "rgba(241, 245, 249, 0.5)",
                rx: 4
              }));

              // Render label text
              root.appendChild(el(svgNS, "text", {
                x: pad,
                y: yPos,
                "text-anchor": "start",
                "font-size": 14,
                "font-family": fontSans,
                "font-weight": 700,
                fill: "rgba(0,0,0,.90)"
              }, label));

              // Circle/pill border around the actual ratio (shared badgeX and 22px height prevents overlap)
              const badgeH = 22;
              const badgePadX = 14;
              const badgeW = Math.max(ratioW + (badgePadX * 2), 52);
              const badgeX = sharedRatioBadgeX;
              const badgeY = yPos - 16;

              root.appendChild(el(svgNS, "rect", {
                x: badgeX,
                y: badgeY,
                width: badgeW,
                height: badgeH,
                rx: badgeH / 2,
                ry: badgeH / 2,
                fill: fillColor,
                stroke: strokeColor,
                "stroke-width": 2
              }));

              // Text inside the circled ratio
              root.appendChild(el(svgNS, "text", {
                x: badgeX + (badgeW / 2),
                y: yPos - 1,
                "text-anchor": "middle",
                "font-size": 14,
                "font-family": fontSans,
                "font-weight": 800,
                fill: textColor
              }, ratioVal));

              // Goal text right after the circled ratio
              let goalText = "";
              if (lineText.includes("Positive to Negative")) {
                goalText = "Goal: 5:1  +:- feedback";
              } else if (lineText.startsWith("Opportunities to Respond")) {
                goalText = "Goal: 3-5 OTRs/min";
              }

              if (goalText) {
                root.appendChild(el(svgNS, "text", {
                  x: badgeX + badgeW + 14,
                  y: yPos,
                  "text-anchor": "start",
                  "font-size": 13,
                  "font-family": fontSans,
                  "font-weight": 600,
                  fill: "#64748b"
                }, goalText));
              }

              continue;
            }

            // 5-minute increment ratio line with lighter pastel pill and subtle row highlight
            if (lineText.includes("min ratio:")) {
              const colonIdx = lineText.indexOf(":");
              const label = lineText.substring(0, colonIdx + 1).trim();
              const ratioVal = lineText.substring(colonIdx + 1).trim();

              let isGoalMet = false;
              if (ratioVal.includes(":")) {
                const parts = ratioVal.split(":");
                const pos = parseInt(parts[0], 10) || 0;
                const neg = parseInt(parts[1], 10) || 0;
                const rVal = neg === 0 ? pos : Math.round(pos / neg);
                isGoalMet = rVal >= 5;
              } else {
                const rateNum = parseFloat(ratioVal);
                isGoalMet = !isNaN(rateNum) && rateNum >= 3;
              }

              const strokeColor = isGoalMet ? "#86efac" : "#fca5a5";
              const fillColor = isGoalMet ? "#f0fdf4" : "#fef2f2";
              const textColor = isGoalMet ? "#15803d" : "#b91c1c";
              const rowHighlight = isGoalMet ? "rgba(240, 253, 244, 0.4)" : "rgba(254, 242, 242, 0.4)";

              // Subtle lighter row background
              root.appendChild(el(svgNS, "rect", {
                x: pad - 4,
                y: yPos - lineH + 5,
                width: W - (pad * 2) + 8,
                height: lineH + 1,
                fill: rowHighlight,
                rx: 4
              }));

              // Render label text (e.g. "0-5 min ratio:")
              root.appendChild(el(svgNS, "text", {
                x: pad + 8,
                y: yPos,
                "text-anchor": "start",
                "font-size": 13.5,
                "font-family": fontSans,
                "font-weight": 600,
                fill: "#334155"
              }, label));

              let measuredLabelW = 0;
              let measuredRatioW = 0;
              try {
                if (measureCtx) {
                  measureCtx.font = `600 13.5px ${fontSans}`;
                  measuredLabelW = measureCtx.measureText(label).width;
                  measureCtx.font = `bold 13.5px ${fontSans}`;
                  measuredRatioW = measureCtx.measureText(ratioVal).width;
                }
              } catch (_) {}

              const labelW = Math.max(measuredLabelW, Math.ceil(label.length * 8.5), 140);
              const ratioW = Math.max(measuredRatioW, Math.ceil(ratioVal.length * 9), 30);

              // Lighter colored pill badge around the ratio
              const badgeH = 22;
              const badgePadX = 10;
              const badgeW = Math.max(ratioW + (badgePadX * 2), 48);
              const badgeX = pad + labelW + 18;
              const badgeY = yPos - 16;

              root.appendChild(el(svgNS, "rect", {
                x: badgeX,
                y: badgeY,
                width: badgeW,
                height: badgeH,
                rx: badgeH / 2,
                ry: badgeH / 2,
                fill: fillColor,
                stroke: strokeColor,
                "stroke-width": 1.5
              }));

              // Text inside the pill badge
              root.appendChild(el(svgNS, "text", {
                x: badgeX + (badgeW / 2),
                y: yPos - 1,
                "text-anchor": "middle",
                "font-size": 13,
                "font-family": fontSans,
                "font-weight": 700,
                fill: textColor
              }, ratioVal));

              continue;
            }

            if (lineText.startsWith("Lesson target referenced:") || lineText.startsWith("Agreed upon teaching materials used:") || lineText.startsWith("Is there a regulation space in the classroom?:") || lineText.startsWith("Is there a graphic depicting the character trait of the month?:") || lineText.startsWith("Is there evidence the educator integrates SEL concepts and strategies into core subjects?:")) {
              const isYes = lineText.endsWith("Yes");
              const isNo = lineText.endsWith("No");
              if (isYes || isNo) {
                root.appendChild(el(svgNS, "rect", {
                  x: pad - 4,
                  y: yPos - lineH + 5,
                  width: W - (pad * 2) + 8,
                  height: lineH + 1,
                  fill: isYes ? "rgba(134, 239, 172, 0.4)" : "rgba(252, 165, 165, 0.4)",
                  rx: 4
                }));
              }
            } else if (lineText.startsWith("Educator models warm") || lineText.startsWith("Educator joins in") || lineText.startsWith("Educator leads") || lineText.startsWith("Students share") || lineText.startsWith("Overall atmosphere") || lineText.startsWith("Evidence of class agreement")) {
              const valStr = lineText.split(": ")[1];
              const labels = ["0 - Not Present", "1 - Partial", "2 - Fully Implemented"];
              const rowColors = ["#d1d5db4d", "#93c5fd4d", "#3b82f64d"];
              const valIndex = labels.indexOf(valStr);
              if (valIndex >= 0) {
                root.appendChild(el(svgNS, "rect", {
                  x: pad - 4,
                  y: yPos - lineH + 5,
                  width: W - (pad * 2) + 8,
                  height: lineH + 1,
                  fill: rowColors[valIndex],
                  rx: 4
                }));
              }
            }

            if (lineText === "Notes:" || lineText === "Observations:" || lineText === "Engagement Check:" || lineText === "Lesson Structure:" || lineText === "Whole Group:" || lineText === "Small Group:" || lineText === "Instructional Feedback:" || lineText === "Five-Minute Increment Ratios:") {
              root.appendChild(el(svgNS, "text", {
                x: pad + 4,
                y: yPos,
                "text-anchor": "start",
                "font-size": 14,
                "font-family": fontSans,
                "font-weight": 700,
                fill: "#0f172a"
              }, lineText));
              continue;
            }

            if (lineText.startsWith("  ")) {
              const textEl = el(svgNS, "text", {
                x: pad + 4,
                y: yPos,
                "text-anchor": "start",
                "font-size": 13.5,
                "font-family": fontSans,
                fill: "#334155"
              });
              textEl.setAttribute("xml:space", "preserve");

              if (lineText.includes("<b>") || lineText.includes("**")) {
                const segments = parseLineToSvgSegments(lineText);
                for (const seg of segments) {
                  const tspan = el(svgNS, "tspan", {
                    "font-weight": seg.bold ? 700 : 500,
                    fill: seg.bold ? "#0f172a" : "#334155"
                  }, seg.text);
                  textEl.appendChild(tspan);
                }
              } else {
                textEl.setAttribute("font-weight", "500");
                textEl.textContent = lineText;
              }

              root.appendChild(textEl);
              continue;
            }

            if (lineText.trim().startsWith("Goal:")) {
              continue;
            }

            root.appendChild(el(svgNS, "text", {
              x: pad,
              y: yPos,
              "text-anchor": "start",
              "font-size": isTitle ? 16 : 14,
              "font-family": fontSans,
              "font-weight": isTitle ? 700 : 500,
              fill: "rgba(0,0,0,.90)"
            }, lineText));
          }

          currentYOffset += block.textBlockH;

          // Render this block's line graph directly below this block's text lines (original location)
          if (block.chartSvg) {
            root.appendChild(el(svgNS, "line", {
              x1: pad, y1: currentYOffset + 8,
              x2: W - pad, y2: currentYOffset + 8,
              stroke: "rgba(0,0,0,.15)",
              "stroke-width": 1
            }));

            const g = document.createElementNS(svgNS, "g");
            g.setAttribute("transform", `translate(0 ${currentYOffset + 18})`);
            const cloned = block.chartSvg.cloneNode(true);
            while (cloned.firstChild){
              g.appendChild(cloned.firstChild);
            }
            root.appendChild(g);
            currentYOffset += (block.chartH || 465) + 28;
          }
        }

        return root;
      }
