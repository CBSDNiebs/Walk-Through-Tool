            summaryContainer.appendChild(createSummaryRow("Positive to Negative (ratio)", ratioText));

            if (state.praiseRatings) {
              const labels = ["N/A", "0", "1", "2", "3"];
              const rowColors = ["#d1d5db4d", "#dbeafe4d", "#93c5fd4d", "#60a5fa4d", "#3b82f64d"];
              if (state.regulationSpace) summaryContainer.appendChild(createSummaryRow("Is there a regulation space in the classroom?", state.regulationSpace));
              if (state.characterTraitGraphic) summaryContainer.appendChild(createSummaryRow("Is there a graphic depicting the character trait of the month?", state.characterTraitGraphic));
              if (state.selEvidence) summaryContainer.appendChild(createSummaryRow("Is there evidence the educator integrates SEL concepts and strategies into core subjects?", state.selEvidence));
              summaryContainer.appendChild(createSummaryRow("Educator models warm & respectful interactions", labels[state.praiseRatings[0]], rowColors[state.praiseRatings[0]]));
              summaryContainer.appendChild(createSummaryRow("Educator joins in community-building activities", labels[state.praiseRatings[1]], rowColors[state.praiseRatings[1]]));
              summaryContainer.appendChild(createSummaryRow("Educator leads activities with enthusiasm", labels[state.praiseRatings[2]], rowColors[state.praiseRatings[2]]));
              summaryContainer.appendChild(createSummaryRow("Students share their ideas and perspectives", labels[state.praiseRatings[3]], rowColors[state.praiseRatings[3]]));
              summaryContainer.appendChild(createSummaryRow("Overall atmosphere of safety and respect", labels[state.praiseRatings[4]], rowColors[state.praiseRatings[4]]));
              summaryContainer.appendChild(createSummaryRow("Evidence of class agreement with student input", labels[state.praiseRatings[5]], rowColors[state.praiseRatings[5]]));
            }
          } else if (renderMode === "Lesson Structure") {
            const ratioText = formatOtrRatio(totalEngagement, durationMs);
            summaryContainer.appendChild(createSummaryRow("Whole Group", totalStructWhole));
            summaryContainer.appendChild(createSummaryRow("Small Group", totalStructSmall));
            summaryContainer.appendChild(createSummaryRow("Partners", totalStructPartners));
            summaryContainer.appendChild(createSummaryRow("Individual", totalStructIndividual));
            summaryContainer.appendChild(createSummaryRow("Total Events", totalEngagement));
            summaryContainer.appendChild(createSummaryRow("Lesson Structure per min (ratio)", ratioText));
            
            if (state.engagementChecks && state.engagementChecks.length > 0) {
              for (const check of state.engagementChecks) {
                const percentOffTask = check.totalStudents > 0 ? Math.round((check.offTaskStudents / check.totalStudents) * 100) : 0;
                summaryContainer.appendChild(createSummaryRow(`Engagement Check (${check.timeMin} min)`, `${check.offTaskStudents} off task / ${check.totalStudents} total (${percentOffTask}%)`));
              }
            }
          } else {
            const ratioText = formatOtrRatio(totalOtr, durationMs);
            summaryContainer.appendChild(createSummaryRow("Choral Response", totalOtrChoral));
            summaryContainer.appendChild(createSummaryRow("Cloze Reading", totalOtrCloze));
            summaryContainer.appendChild(createSummaryRow("White Board Response", totalOtrWhiteboard));
            summaryContainer.appendChild(createSummaryRow("Precision Partner", totalOtrPrecision));
            summaryContainer.appendChild(createSummaryRow("Elbow Partner", totalOtrElbow));
            summaryContainer.appendChild(createSummaryRow("Warm Call", totalOtrWarm));
            summaryContainer.appendChild(createSummaryRow("Cold Call", totalOtrCold));
            summaryContainer.appendChild(createSummaryRow("Volunteer", totalOtrVolunteer));
            summaryContainer.appendChild(createSummaryRow("Opportunities to Respond Total", totalOtr));
            summaryContainer.appendChild(createSummaryRow("Opportunities to Respond per min (ratio)", ratioText));
          }
          modeContainer.appendChild(summaryContainer);
          
          const chartWrap = document.createElement("div");
          chartWrap.className = "chartWrap";
          
          const chartTitle = document.createElement("div");
          chartTitle.className = "chartTitle";
          const modeDisplay = renderMode === "Praise" ? "Social Emotional Learning" : renderMode === "Lesson Structure" ? "Lesson Structure" : "Opportunities to Respond";
          chartTitle.textContent = `${modeDisplay} per minute over time`;
          chartWrap.appendChild(chartTitle);
          
          const chartHost = document.createElement("div");
          chartHost.className = "chartHost";
          chartHost.setAttribute("role", "img");
          chartHost.setAttribute("aria-label", `${modeDisplay} chart`);
          
          // Create lines and charts for this block
          const oldStateMode = state.mode;
          state.mode = renderMode;
          
          let chartSvg;
          let modeEvents = [];
          if (renderMode === "Praise") {
             modeEvents = state.otrEvents.filter(e => ["specific","general","corrective","redirect","genCrit","indCrit"].includes(e.kind));
             chartSvg = renderOtrMultiLineChartSVG(modeEvents, durationMs);
          } else if (renderMode === "Lesson Structure") {
             modeEvents = state.otrEvents.filter(e => ["structWhole","structSmall","structPartners","structIndividual"].includes(e.kind));
             chartSvg = renderEngagementStackedBarChartSVG(modeEvents, durationMs);
          } else {
             modeEvents = state.otrEvents.filter(e => ["otrChoral","otrCloze","otrWhiteboard","otrPrecision","otrElbow","otrWarm","otrCold","otrVolunteer"].includes(e.kind));
             chartSvg = renderOtrMultiLineChartSVG(modeEvents, durationMs);
          }
          
          chartHost.appendChild(chartSvg);
          chartWrap.appendChild(chartHost);
          modeContainer.appendChild(chartWrap);
          
          resultsGrid.appendChild(modeContainer);
          
          const curOtrTotal = renderMode === "Praise" ? totalPraise : renderMode === "Lesson Structure" ? totalEngagement : totalOtr;
          const curRatioText = renderMode === "Praise" ? formatPraiseRatio(positivePraise, negativePraise, durationMs) : formatOtrRatio(curOtrTotal, durationMs);
          
          const lines = buildResultsLines({
              educator: state.educatorName,
              recordedOn: state.startWall ? state.startWall.toLocaleDateString() : "",
              recordedFrom: formatTime(state.startWall) + " to " + formatTime(state.stopWall),
              durationMs,
              lessonTargetPosted: state.lessonTargetPosted,
              curriculaMaterialsUsed: state.curriculaMaterialsUsed,
              regulationSpace: state.regulationSpace,
              characterTraitGraphic: state.characterTraitGraphic,
              selEvidence: state.selEvidence,
              
              structWhole: totalStructWhole,
              structSmall: totalStructSmall,
              structPartners: totalStructPartners,
              structIndividual: totalStructIndividual,

              otrChoral: totalOtrChoral,
              otrCloze: totalOtrCloze,
              otrWhiteboard: totalOtrWhiteboard,
              otrPrecision: totalOtrPrecision,
              otrElbow: totalOtrElbow,
              otrWarm: totalOtrWarm,
              otrCold: totalOtrCold,
              otrVolunteer: totalOtrVolunteer,

              specific: totalSpecific,
              general: totalGeneral,
              corrective: totalCorrective,
              redirect: totalRedirect,
              genCrit: totalGenCrit,
              indCrit: totalIndCrit,

              otrTotal: curOtrTotal,
              ratioText: curRatioText,
              notes: renderMode === renderModes[0] ? state.notes : "",
              engagementChecks: state.engagementChecks,
              praiseRatings: state.praiseRatings
          });
          state.mode = oldStateMode;
          // Strip top common info if not first
          if (renderMode !== renderModes[0]) {
             lines.splice(1, 6); // remove educator, date, time, duration, materials, target
          }
          
          sharedBlocks.push({ lines, chartSvg });
        }

        const notesText = document.getElementById("resultsNotesText");
        notesText.value = state.notes;
        
        const adjustNotesHeight = () => {
          notesText.style.height = "auto";
          notesText.style.height = (notesText.scrollHeight) + "px";
        };
        
        notesText.addEventListener("input", (e) => {
          state.notes = e.target.value;
          adjustNotesHeight();
        });
        
        requestAnimationFrame(adjustNotesHeight);

        document.getElementById("restartBtn").addEventListener("click", () => showSetup("setup"));
        document.getElementById("resultsBackBtn").addEventListener("click", () => showQuestions());

        const shareBtn = document.getElementById("shareBtn");
        const shareStatus = document.getElementById("shareStatus");

        shareBtn.addEventListener("click", () => {
          shareStatus.textContent = "Generating image...";
          shareBtn.disabled = true;
          shareBtn.textContent = "Copied";
          shareBtn.classList.add("copied");

          // Update notes in the first block before rendering
          const oldStateMode = state.mode;
          state.mode = renderModes[0];
          const firstOtrTotal = state.mode === "Praise" ? totalPraise : state.mode === "Lesson Structure" ? totalEngagement : totalOtr;
          const firstRatioText = state.mode === "Praise" ? formatPraiseRatio(positivePraise, negativePraise, durationMs) : formatOtrRatio(firstOtrTotal, durationMs);
          
          sharedBlocks[0].lines = buildResultsLines({
              educator: state.educatorName,
              recordedOn: state.startWall ? state.startWall.toLocaleDateString() : "",
              recordedFrom: formatTime(state.startWall) + " to " + formatTime(state.stopWall),
              durationMs,
              lessonTargetPosted: state.lessonTargetPosted,
              curriculaMaterialsUsed: state.curriculaMaterialsUsed,
              regulationSpace: state.regulationSpace,
              characterTraitGraphic: state.characterTraitGraphic,
              selEvidence: state.selEvidence,
              structWhole: totalStructWhole, structSmall: totalStructSmall, structPartners: totalStructPartners, structIndividual: totalStructIndividual,
              otrChoral: totalOtrChoral, otrCloze: totalOtrCloze, otrWhiteboard: totalOtrWhiteboard,
              otrPrecision: totalOtrPrecision, otrElbow: totalOtrElbow, otrWarm: totalOtrWarm, otrCold: totalOtrCold, otrVolunteer: totalOtrVolunteer,
              specific: totalSpecific, general: totalGeneral, corrective: totalCorrective,
              redirect: totalRedirect, genCrit: totalGenCrit, indCrit: totalIndCrit,
              otrTotal: firstOtrTotal,
              ratioText: firstRatioText,
              notes: state.notes,
              engagementChecks: state.engagementChecks,
              praiseRatings: state.praiseRatings
          });
          state.mode = oldStateMode;

          const blobPromise = (async () => {
            const composite = renderResultsCompositeSVG(sharedBlocks);
            return await svgElementToPngBlob(composite, 2);
          })();

          const isMobile = /iPad|iPhone|iPod|Android/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

          const handleSuccess = () => {
            shareStatus.textContent = "Data and graph copied to clipboard! You can now paste it into an email.";
            shareBtn.disabled = false;
            setTimeout(() => {
              shareBtn.textContent = "Share";
              shareBtn.classList.remove("copied");
            }, 3000);
          };

          const resetShareBtn = () => {
            shareBtn.disabled = false;
            setTimeout(() => {
              shareBtn.textContent = "Share";
              shareBtn.classList.remove("copied");
            }, 3000);
          };

          if (isMobile && navigator.canShare) {
             blobPromise.then(async (blob) => {
                 try {
                     const file = new File([blob], safeFilename(), { type: "image/png" });
                     if (navigator.canShare({ files: [file] })) {
                         await navigator.share({ files: [file] });
                         shareStatus.textContent = "Shared successfully!";
                     } else {
                         throw new Error("canShare returned false");
                     }
                 } catch (err) {
                     if (err.name === "AbortError") {
                         shareStatus.textContent = "Share cancelled.";
                     } else {
                         downloadBlob(blob, safeFilename());
                         shareStatus.textContent = "Image downloaded!";
                     }
                 }
                 resetShareBtn();
             });
          } else {
             try {
                 const item = new ClipboardItem({ "image/png": blobPromise });
                 navigator.clipboard.write([item]).then(handleSuccess).catch(async () => {
                     const blob = await blobPromise;
                     downloadBlob(blob, safeFilename());
                     shareStatus.textContent = "Image downloaded! (Clipboard access blocked)";
                     resetShareBtn();
                 });
             } catch (err) {
                 blobPromise.then(async (blob) => {
                     try {
                         const item = new ClipboardItem({ "image/png": blob });
                         await navigator.clipboard.write([item]);
                         handleSuccess();
                     } catch (clipboardErr) {
                         try {
                             const file = new File([blob], safeFilename(), { type: "image/png" });
                             if (navigator.canShare && navigator.canShare({ files: [file] })) {
                                 await navigator.share({ files: [file] });
                                 shareStatus.textContent = "Shared successfully!";
                             } else {
                                 throw clipboardErr;
                             }
                         } catch (fallbackErr) {
                             downloadBlob(blob, safeFilename());
                             shareStatus.textContent = "Image downloaded!";
                         }
                     }
                     resetShareBtn();
                 }).catch(blobErr => {
                     shareStatus.textContent = "Error generating image: " + blobErr.message;
                     resetShareBtn();
                 });
             }
          }
        });
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && state.currentScreen === "run") {
          const startBtn = document.getElementById("startBtn");
          if (startBtn && !startBtn.disabled) {
            if (document.activeElement && (document.activeElement.tagName.toLowerCase() === "textarea" || document.activeElement.tagName.toLowerCase() === "input")) {
              return;
            }
            e.preventDefault();
            startBtn.click();
          }
        }
      });

      // Initialize App
      showSetup();
    });
  </script>
</body>
</html>
